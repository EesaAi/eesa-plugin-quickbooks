<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QuickBooks</title>
<!-- Where Eesa is served from, exactly, space-separated: the gateway serves
     this page with EESA_ORIGINS here. Empty, no session is trusted. -->
<meta name="eesa-origins" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  QuickBooks in Eesa — Eesa's chat, for the QuickBooks agent only.

  THE SHAPE (Eesa's rule since 2026-09-25: the interface is agentic)
    The same chat as Eesa's own: the chats down the side, the conversation,
    one box to type or speak. Everything said goes to the QuickBooks agent,
    which answers from the books and hands setup ("add Alex, $18 an hour")
    to the assistant of the app it is about. A request is a card in the
    conversation that asked for it, with its log and the one decision it
    needs; each answer carries the steps the agent took. Anything waiting on
    the person from elsewhere sits at the top of the chats, as "Waiting on you".

  NO CREDENTIAL EVER REACHES THIS PAGE
    1. The Eesa shell posts { type:'eesa:session', token, theme, apiBase, route },
       taken only from an origin listed in <meta name="eesa-origins">.
    2. Every call goes to POST {eesa}/api/v1/gateway/plugin-ui-invoke/ with
       that short-lived token. Eesa checks the person's recorded QuickBooks
       role, injects this plugin's key server-side, and proxies the call.
    3. The page asks for the role FIRST and only asks for what it covers.

  THE ARGUMENT ENVELOPE IS NOT WHAT IT LOOKS LIKE
    Intuit's tools take { params: {...} }; Eesa's own take plain arguments.
    Two call paths below, invoke() and platform(), deliberately.

  THIS REPOSITORY IS PUBLIC — no real names, emails or figures in this file.
-->
<style>
  /* Eesa's own tokens (Tool-Flow-Frontend globals.css), so this reads as
     Eesa's chat, not a page inside it. */
  :root {
    --bg: oklch(0.99 0 0); --fg: oklch(0.16 0.012 240); --card: oklch(1 0 0);
    --primary: oklch(0.50 0.20 270); --on-primary: oklch(0.99 0 0);
    --muted: oklch(0.97 0.005 240); --muted-fg: oklch(0.50 0.012 240);
    --border: oklch(0.92 0.005 240); --danger: oklch(0.58 0.22 27);
    --ok: oklch(0.56 0.15 150); --warn: oklch(0.62 0.16 65);
    --qb: #2CA01C;
    --safe: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    --bg: oklch(0.155 0.008 240); --fg: oklch(0.97 0.003 240); --card: oklch(0.195 0.008 240);
    --primary: oklch(0.62 0.19 259); --on-primary: oklch(0.99 0 0);
    --muted: oklch(0.225 0.008 240); --muted-fg: oklch(0.66 0.012 240);
    --border: oklch(0.255 0.008 240); --ok: oklch(0.72 0.15 150); --warn: oklch(0.78 0.14 75);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
         font: 14px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  svg { flex: none; }

  /* ── the chats, and the conversation beside them ── */
  .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100%; }
  .side { display: flex; flex-direction: column; min-height: 0; padding: 12px 10px calc(10px + var(--safe));
          border-right: 1px solid var(--border); background: var(--bg); }
  .side-top { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; }
  .side-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); }
  .new { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 34px; border: 0;
         border-radius: 8px; background: var(--primary); color: var(--on-primary); font-size: 13px; font-weight: 500; cursor: pointer; }
  .new:hover { filter: brightness(1.06); }
  .convs { flex: 1; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; padding: 0 2px; }
  .conv { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; cursor: pointer; padding: 9px 10px;
          border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
  .conv:hover { border-color: color-mix(in oklch, var(--primary) 35%, var(--border)); }
  .conv.on { border-color: color-mix(in oklch, var(--primary) 55%, var(--border));
             background: color-mix(in oklch, var(--primary) 6%, var(--card)); }
  .conv .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; position: relative;
              background: color-mix(in oklch, var(--primary) 12%, transparent); color: var(--primary); }
  .conv .ic.wait { background: color-mix(in oklch, var(--warn) 16%, transparent); color: var(--warn); }
  .conv .waitdot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 99px;
                   background: var(--warn); box-shadow: 0 0 0 2px var(--bg); }
  .conv .t { flex: 1; min-width: 0; }
  .conv .t b { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .t small { display: block; font-size: 11.5px; color: var(--muted-fg); }
  .scrim { display: none; }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); min-height: 56px; }
  .bar .tt { flex: 1; min-width: 0; }
  .bar h1 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
  .bar .co { font-size: 12px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-radius: 8px;
           background: transparent; cursor: pointer; font-size: 13px; font-weight: 500; }
  .ghost:hover { background: var(--muted); }
  .menu { display: none; padding: 0 8px; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px; }
  .col { max-width: 780px; margin: 0 auto; padding: 20px 0 16px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }

  @media (max-width: 899px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .side { position: fixed; z-index: 40; inset: 0 auto 0 0; width: min(86vw, 320px); transform: translateX(-105%);
            transition: transform .22s ease; box-shadow: 0 0 40px rgba(0,0,0,.18); }
    .shell.open .side { transform: none; }
    .shell.open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.28); }
    .menu { display: inline-flex; }
    .bar .newtxt { display: none; }
  }

  /* ── home: where things stand, laid out ── */
  .col:has(.home) { max-width: 1360px; }
  .home { width: 100%; display: flex; flex-direction: column; gap: 16px; padding: 4px 0 20px; }
  .hello { display: flex; gap: 12px; align-items: flex-start; }
  .hello h2 { margin: 3px 0 4px; font-size: 18px; font-weight: 600; }
  .hello .status { margin: 0; max-width: none; text-align: left; }
  /* One column on a phone, in the order a person deals with things; two lanes wider. */
  .board { display: flex; flex-direction: column; gap: 14px; }
  .lane { display: contents; }
  .sec.needs { order: 1; } .sec.chart { order: 2; } .sec.week { order: 3; } .sec.flows { order: 4; } .sec.alerts { order: 5; }
  .sec.systems { order: 6; } .sec.done { order: 7; }
  /* The dashboard (29 Sep 2026, "panels first"): chart, then events-flows-alerts, then what needs you — three columns wide. */
  @media (min-width: 1280px) {
    .board { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) !important; }
  }
  .needlist { display: flex; flex-direction: column; }
  .needrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; background: none;
             border: 0; border-top: 1px solid var(--border); padding: 9px 0; font: inherit; font-size: 13.5px; text-align: left;
             color: inherit; cursor: pointer; min-width: 0; }
  .needrow:first-child { border-top: 0; }
  .needrow > span { min-width: 0; overflow-wrap: anywhere; }
  .needrow.decide > span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                                    background: var(--warn); margin-right: 8px; vertical-align: middle; }
  /* The dashboard's numbers: each one a way to its panel. */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 10px 12px; display: flex;
         flex-direction: column; gap: 2px; text-align: left; font: inherit; color: inherit; cursor: pointer; min-width: 0; }
  .kpi b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--muted-fg); }
  .kpi.warn b { color: var(--warn); }
  .kpi:focus-visible { outline: 2px solid var(--primary, currentColor); outline-offset: 2px; }
  .coa-find { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.4; }
  .coa-find .k { flex: none; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; margin-top: 1px;
                 background: color-mix(in oklch, var(--warn) 14%, transparent); color: var(--warn); }
  .coa-find small { display: block; color: var(--muted-fg); }
  .coa-group { border-top: 1px solid var(--border); }
  .coa-group > button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0;
                        padding: 8px 0; font: inherit; font-weight: 600; font-size: 13.5px; color: inherit; cursor: pointer; }
  .coa-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; min-width: 0; }
  .coa-row > span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .coa-row small { color: var(--muted-fg); font-size: 11.5px; }
  .coa-row.idle { color: var(--muted-fg); }
  .coa-row .amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (min-width: 760px) and (max-width: 899px), (min-width: 1080px) {
    .board { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
    .lane { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  }
  .sec { border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 12px 14px;
         display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .sec.bare { border: 0; background: none; padding: 0; gap: 10px; }
  .sech { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 26px; }
  .sech h3 { margin: 0; display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; }
  .sech h3 .ic { color: var(--muted-fg); display: grid; }
  .sech .n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: inline-grid; place-items: center;
             font-size: 11px; font-weight: 700; background: color-mix(in oklch, var(--warn) 16%, transparent); color: var(--warn); }
  .sech .n.plain { background: var(--muted); color: var(--muted-fg); }
  .quiet { margin: 0; font-size: 13px; color: var(--muted-fg); }
  .item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .item .fi { color: var(--muted-fg); display: grid; padding-top: 1px; }
  .item .fi.ok { color: var(--ok); } .item .fi.bad { color: var(--danger); } .item .fi.qb { color: var(--qb); }
  .item .main { display: block; height: auto; flex: 1; min-width: 0; line-height: 1.4; }
  .item .main b { font-weight: 600; }
  .item small { display: block; color: var(--muted-fg); font-size: 12px; }
  .item .side-acts { display: flex; gap: 6px; flex: none; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .item .btn { height: 26px; padding: 0 9px; font-size: 12px; }
  .item .tap { cursor: pointer; }
  .feeds { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted-fg); }
  .startchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .startchip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid var(--border);
               border-radius: 15px; background: var(--card); color: var(--fg); font: inherit; font-size: 12.5px; cursor: pointer; }
  .startchip:hover { background: var(--muted); }
  .startchip svg { color: var(--muted-fg); }

  /* ── an empty chat: Eesa's hero, and a few ways to start ── */
  .empty { margin: auto; width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 0; text-align: center; }
  .hero-ic { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center;
             background: color-mix(in oklch, var(--primary) 10%, transparent); color: var(--primary);
             box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--primary) 20%, transparent); }
  .empty h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .status { margin: -8px 0 0; max-width: 520px; font-size: 13px; line-height: 1.55; color: var(--muted-foreground); }
  .status .bad { color: var(--danger); }
  .linkish { padding: 0; border: 0; background: none; font: inherit; color: var(--primary); cursor: pointer;
             text-decoration: underline; text-underline-offset: 2px; }
  .starts { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .start { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px; border: 1px solid transparent;
           border-radius: 12px; background: color-mix(in oklch, var(--muted) 45%, transparent); cursor: pointer; text-align: left; }
  .start:hover { border-color: var(--border); background: var(--muted); }
  .start .si { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); color: var(--muted-fg); }
  .start b { display: block; font-size: 13.5px; font-weight: 500; }
  .start small { display: block; font-size: 11.5px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .start .t { flex: 1; min-width: 0; }

  /* ── messages, as Eesa draws them ── */
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.me { justify-content: flex-end; }
  .av { width: 32px; height: 32px; border-radius: 999px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 600;
        background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary);
        box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--primary) 20%, transparent); }
  .stack { min-width: 0; max-width: 85%; display: flex; flex-direction: column; gap: 6px; }
  .bubble { border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .row.me .bubble { background: var(--primary); color: var(--on-primary); border-top-right-radius: 4px; max-width: 85%; }
  .row.ai .bubble { background: color-mix(in oklch, var(--muted) 60%, transparent); border-top-left-radius: 4px; overflow-x: auto; }
  .bubble > :first-child { margin-top: 0; } .bubble > :last-child { margin-bottom: 0; }
  .bubble p { margin: 8px 0; } .bubble h3 { font-size: 14px; margin: 12px 0 6px; }
  .bubble ul { margin: 8px 0; padding-left: 20px; }
  .bubble table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bubble th, .bubble td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  .bubble th { color: var(--muted-fg); font-size: 12px; font-weight: 600; }
  .bubble td.n, .bubble th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .bubble code { background: var(--muted); border-radius: 5px; padding: 1px 5px; font-size: 13px; }
  .scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .thinking { color: var(--muted-fg); }
  .working::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 99px; background: var(--primary);
                    margin-left: 8px; vertical-align: middle; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .tools { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border: 0; border-radius: 7px;
          background: transparent; color: var(--muted-fg); font-size: 12px; cursor: pointer; }
  .chip:hover { background: var(--muted); color: var(--fg); }
  .chip[aria-expanded="true"] svg.chev { transform: rotate(180deg); }

  /* The steps an answer took, and a flow's log: one line per thing that happened. */
  .log { list-style: none; margin: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
         background: color-mix(in oklch, var(--muted) 30%, transparent); display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .log li { display: flex; gap: 8px; align-items: baseline; }
  .log .dot { width: 7px; height: 7px; border-radius: 99px; background: var(--muted-fg); flex: none; transform: translateY(-1px); }
  .log .person .dot { background: var(--primary); } .log .assistant .dot { background: oklch(0.6 0.18 300); }
  .log .checker .dot { background: var(--warn); } .log .eesa .dot, .log .quickbooks .dot { background: var(--ok); }
  .log .bad .dot { background: var(--danger); }
  .log .next .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--primary); }
  .log b { font-weight: 600; }
  .log .tx { flex: 1; min-width: 0; }
  .log time { color: var(--muted-fg); font-size: 11px; white-space: nowrap; }

  /* ── a flow: a request or a change, with its log and one decision ── */
  .flow { border: 1px solid var(--border); border-radius: 14px; background: var(--card); overflow: hidden; }
  .flow.wait { border-color: color-mix(in oklch, var(--warn) 45%, var(--border)); }
  .fh { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px 0; }
  .fh .fi { width: 20px; height: 20px; display: grid; place-items: center; color: var(--muted-fg); flex: none; margin-top: 1px; }
  .flow.wait .fh .fi { color: var(--warn); } .flow.done .fh .fi { color: var(--ok); } .flow.bad .fh .fi { color: var(--danger); }
  .fh .ft { flex: 1; min-width: 0; }
  .fh b { display: block; font-size: 13.5px; font-weight: 700; overflow-wrap: anywhere; }
  .fh small { display: block; font-size: 12px; color: var(--muted-fg); }
  .fh .amt { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fb { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .steps { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .lines { border-top: 1px solid var(--border); }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .found { border-radius: 10px; padding: 9px 11px; font-size: 12.5px; background: var(--muted); }
  .found.warn { background: color-mix(in oklch, var(--warn) 10%, transparent); }
  .found.bad { background: color-mix(in oklch, var(--danger) 9%, transparent); }
  .found.ok { background: color-mix(in oklch, var(--ok) 9%, transparent); }
  .found > b { display: block; margin-bottom: 3px; font-weight: 600; }
  .f { display: flex; gap: 7px; margin-top: 2px; }
  .f > span:first-child { width: 12px; flex: none; font-weight: 700; }
  .f.ok > span:first-child { color: var(--ok); } .f.warn > span:first-child { color: var(--warn); } .f.stop > span:first-child { color: var(--danger); }
  .f em { font-style: normal; font-size: 11px; color: var(--muted-fg); margin-left: 3px; }
  .strip { border-radius: 10px; padding: 8px 11px; font-size: 12.5px; }
  .strip.bad { background: color-mix(in oklch, var(--danger) 9%, transparent); color: var(--danger); }
  .strip.warn { background: color-mix(in oklch, var(--warn) 10%, transparent); }
  .ask { margin: 0; font-size: 13.5px; }
  .answer { display: flex; gap: 8px; }
  .answer input { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); }
  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; }
  .actions .meta { flex: 1 1 180px; text-align: left; }
  .meta, .say { font-size: 12px; color: var(--muted-fg); margin: 0; }
  .say.bad { color: var(--danger); }
  .btn { height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer;
         font-size: 13px; font-weight: 500; }
  .btn:hover { background: var(--muted); }
  .btn.primary { background: var(--primary); border-color: transparent; color: var(--on-primary); }
  .btn.primary:hover { filter: brightness(1.06); background: var(--primary); }
  .btn.link { border: 0; background: transparent; color: var(--primary); padding: 0 4px; }
  .btn.danger { background: var(--danger); border-color: transparent; color: #fff; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .card { border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .card h3 { margin: 0; font-size: 13.5px; font-weight: 700; }
  .card.wait { border-color: color-mix(in oklch, var(--warn) 45%, var(--border)); }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; } .md p { margin: 6px 0; }

<script>
'use strict';

// ── session, handed in by the Eesa shell ────────────────────────────────
// Only an Eesa page may hand this page a session: its origin must be one the
// gateway listed, exactly. The session used to be taken from anyone who posted
// one, and calls went wherever its apiBase said — a token and every answer
// handed to whichever page framed this one. There is no fallback host: a page
// with no session says so instead of guessing where Eesa is.
var TOKEN = null, EESA = null, PARENT = null, SHELL_OPENS = false, booted = false, ACCESS = null, ROUTE = null;
var ORIGINS = [];
document.querySelectorAll('meta[name="eesa-origins"]').forEach(function (m) {

});
function allowed(o) { return ORIGINS.indexOf(o) !== -1; }

  // that is still an Eesa page: the app frames this one exactly as the web does.
  var api = '';
  try { if (typeof m.apiBase === 'string' && allowed(new URL(m.apiBase).origin)) api = m.apiBase.replace(/\/+$/, ''); } catch (e) {}

  PARENT = ev.origin;

  SHELL_OPENS = typeof m.apiBase === 'string';
  if (m.token !== TOKEN) { TOKEN = m.token; renewed(); }
  if (m.theme) document.documentElement.setAttribute('data-theme', m.theme);

  if (!booted) { booted = true; ROUTE = cleanRoute(m.route); boot(); }
});
try { parent.postMessage({ type: 'eesa:plugin-ready' }, '*'); } catch (e) {}

// A session lasts minutes and the shell renews it on a timer — but a laptop
// that slept, or a tab left in the background, can wake with the old one still
// in hand (seen live: "Invalid or expired session token (Signature has
// expired)" left in the sidebar). So a 401 is not an answer: ask the shell for
// a fresh session, wait for one different from the one refused, and try once
// more. Only when none comes is the person told, in words.
var WAITING = [];

// shell, because a failure that never reaches a server looks like nothing.
setTimeout(function () {
  if (booted) return;
  $('#view').innerHTML = '<div class="nothing">Open QuickBooks from inside Eesa.</div>';
  tell('quickbooks.page.boot', 'fail', 'no_session');
}, 8000);

/** What happened here, for the shell to record: names and codes, never a token or a figure. */
function tell(name, outcome, code, context) {

  } catch (e) {}
}
var told = {};
function tellOnce(key, name, outcome, code, context) { if (!told[key]) { told[key] = true; tell(name, outcome, code, context); } }

/** Where the shell asked to open (a push, a link): these keys only, plain ids only. */
function cleanRoute(r) {
  var out = null;
  ['view', 'change', 'run', 'conv', 'draft'].forEach(function (k) {
    if (r && typeof r[k] === 'string' && /^[A-Za-z0-9:_-]{1,64}$/.test(r[k])) (out = out || {})[k] = r[k];

}
function applyRoute(r) {
  if (!r) return;
  if (r.conv) { openConv(r.conv); return; }
  if (r.view === 'calendar') { openCalendar(); return; }
  if (r.view === 'needs' || r.change || r.run || r.draft) {
    ST.focus = r;
    if (r.run) track(r.run, 'queued');

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/** Intuit's tools. Every one takes { params: {...} }; a bare {} is rejected. */
async function invoke(tool, params) {
  return send({ tool: tool, args: { params: params || {} } });
}

/**
 * Eesa's OWN tools, which are not Intuit's and do not take { params }.
 *
 * Same endpoint and token, a different allowlist on the other side: these
 * dispatch through Eesa's registry as the person in this session, so the role
 * checks that apply in chat apply here. Wrapping these in `params` would send
 * the arguments where nothing reads them, and the tool answers as though called
 * with none — which reads as an empty account rather than a malformed call.
 */
async function platform(tool, args) {
  return send({ tool: tool, args: args || {} });
}

/** Eesa's tools, with a refusal turned into an error that says why. */
async function call(tool, args) {
  var r = await platform(tool, args || {});
  if (!r || r.ok === false) {
    // Eesa's tools put the sentence in `message` and the code in `error`.
    var err = new Error((r && (r.message || r.error)) || 'That did not work. Try again.');
    err.code = r && (r.code || r.error);
    throw err;
  }

/**
 * One POST, retried once if the connection drops.
 *
 * Measured 2026-09-10 from this page: six short calls, six successes; three
 * long ones (the agent turn, 12–16s), one failure — a bare TypeError from
 * fetch, no status, nothing logged server-side. Long requests are dropped
 * somewhere between the browser and Django, at a rate a person asking three
 * questions would meet.
 *
 * A dropped connection is not a refusal, and a read is safe to repeat, so it is
 * retried once. Only on a network-level failure: an HTTP status means the
 * server answered and is the answer, and retrying a 403 would just ask a
 * question we have already been told the answer to.
 */

  var url = EESA + '/api/v1/gateway/plugin-ui-invoke/';
  var init = {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
    body: JSON.stringify({ tool: body.tool, args: body.args }),

  var tries = own(WRITES, body.tool) ? 1 : 2;

    try { res = await fetch(url, init); break; }
    catch (e) {

      // with Eesa's next deploy, and is not asked for again until then.

      err = new Error('This needs the latest Eesa — try again shortly');
      err.code = 'not_available';
    } else if (out.code === 'not_connected_here') {
      ST.conn = Object.assign({}, ST.conn, { state: 'NOT_CONNECTED' });
      err = new Error(out.detail || 'QuickBooks isn’t connected for this workspace yet.');
    } else if (res.status === 403) {
      err = new Error('Your QuickBooks access does not cover this. Ask whoever '
        + 'looks after QuickBooks to check your role.');
    } else err = new Error(out.detail || 'QuickBooks did not answer. Try again in a moment.');

var MISSING = {};   // tools this Eesa has not got yet
var WRITES = { quickbooks_draft_decide: 1, quickbooks_schedule_change: 1, quickbooks_change_decide: 1, qb_review: 1,

/**
 * A button here is the person's own tap. A tool asked from one holds a draft,
 * as it does for the agent — Eesa never lets a call confirm itself — so the
 * page answers the draft it is handed, as them, with that tap.
 */
async function tapped(tool, args) {
  var r = await call(tool, args);
  var id = r.draft_id || (r.card && r.card.type === 'draft' && r.card.id);
  if (!id) return r;
  var d = await call('quickbooks_draft_decide', { draft_id: id, decision: 'yes' });
  return d.result || d;
}

/**
 * Get the data out, whatever shape it arrives in.
 *
 * Verified against the live gateway, because guessing cost a whole build:
 *   get_company_info    -> the object itself   { CompanyName: "…", … }
 *   get_profit_and_loss -> { text: "Profit and Loss Report: {…}" }
 *   get_aged_receivables-> { text: "…" }

 * not others, and a report's text carries a human prefix before its JSON. An
 * earlier version of this handled only the envelope and so rendered every panel

function payload(out) {

  if (Array.isArray(c)) {
    for (var i = 0; i < c.length; i++) {

    }

  if (text === null) {
    return (out.data && typeof out.data === 'object') ? out.data : out;

  var brace = text.indexOf('{');

// Money is in the company's currency, written the company's way, wherever the
// reader is: "$1,240", never the "US$1,240" a browser set to another country
// would write. quickbooks_my_access names both. An Eesa too old to name them

  var cur = has ? ACCESS.currency : 'USD', loc = (has && ACCESS.money_locale) || 'en-US';
  var plain = { minimumFractionDigits: 2, maximumFractionDigits: 2 };

    return Number(n).toLocaleString(loc, cur ? Object.assign({ style: 'currency', currency: cur }, whole ? { maximumFractionDigits: 0 } : {}) : plain);

}
function cash(n) { return fmt(n || 0, false); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function count(n, one, many) {
  var words = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];

  (function walk(n) {

    if (Array.isArray(n)) { n.forEach(walk); return; }
    var label = n.group || n.ColData && n.ColData[0] && n.ColData[0].value;

 * Add up the named report sections. Names are QuickBooks' own `group` keys
 * ("Income", "COGS", "OtherExpenses", …), which are stable across companies —
 * unlike the row labels, which a company can rename.
 *

  groups.forEach(function (g) {
    var v = findTotal(report, g);

 * midnight, so anywhere east of Greenwich it lands on the previous day in UTC
 * and every period silently shifted a day early: at GMT+0530 on 9 September
 * 2026 "Last month" asked QuickBooks for 2026-07-31 to 2026-08-30 — wrong at

function agingRows(report) {
  var rows = [];
  (function walk(n) {
    if (!n || typeof n !== 'object') return;
    if (Array.isArray(n)) { n.forEach(walk); return; }
    var cd = n.ColData;
    if (Array.isArray(cd) && cd.length > 1) {

      var amt = Number(String((cd[cd.length - 1] || {}).value || '').replace(/[^0-9.-]/g, ''));

}

// ── the smallest markdown that renders an accounts answer ───────────────
// The agent replies in GitHub markdown, and its tables ARE the answer — shown
// as raw pipes they are unreadable, and an accountant will not trust what they
// cannot scan. Escaped first, so nothing in a reply can inject.
function md(src) {

  try {

    ST.sruns[id] = (((r.schedules || r.items || [])[0]) || {}).runs || [];
  } catch (e) { ST.sruns[id] = { error: e.message }; }
  paintView();
}

/** Run it now: a run that failed or was missed, asked for again, as the person who tapped. */
async function runNow(key) {
  var o = HELD[key], out = null;
  if (!o) return;
  var args = { id: o.source_id || o.id, action: 'run_now' };
  if (o.occurrence) args.occurrence = o.occurrence;
  var go = async function () { out = await tapped('quickbooks_schedule_change', args); };
  // A flow may ask QuickBooks for a change; when the item cannot say, ask first.
  if (o.proposes || o.type === 'flow' || o.kind === 'flow') {
    if (!(await dialog({ title: 'Run it now?', ok: 'Run it now', submit: go,
                         sub: o.proposes ? 'This asks QuickBooks for ' + esc(o.proposes) + '. Approvers will be told.'
                                         : 'If this flow asks QuickBooks for a change, the approvers will be told.' }))) { paintView(); return; }
  } else await go();
  var run = out && (out.run_id || (out.result && out.result.run_id));
  if (run) { ST.ran[key] = run; track(run, 'queued'); }
  toast(run ? 'Running — it says here when it’s done' : (out && out.message) || 'Asked for');
  paintNow();
}

// A run is queued on the server and answers with its id at once; the run
// takes as long as it takes, and the edge gives up on any call over 30
// seconds. So it is polled: every 2 seconds, every 10 after two minutes.
var runTimer = null;
function track(id, status) {
  if (!id || ST.runs[id]) return;
  ST.runs[id] = { run_id: id, status: status || 'queued', since: Date.now() };
  watchRuns(2000);
}
function watchRuns(ms) {
  clearTimeout(runTimer);
  var ids = Object.keys(ST.runs).filter(function (id) { return RUNNING.indexOf(ST.runs[id].status) !== -1; });
  if (!ids.length) return;
  runTimer = setTimeout(async function () {
    await Promise.all(ids.map(function (id) {
      return call('quickbooks_run_status', { run_id: id }).then(function (r) { Object.assign(ST.runs[id], r.run || r); })
        .catch(function (e) { ST.runs[id].status = 'unknown'; ST.runs[id].error = e.message; });
    }));
    var ended = ids.some(function (id) { return RUNNING.indexOf(ST.runs[id].status) === -1; });
    paintView();
    if (ended) { if (ST.view === 'calendar') loadCalendar(); loadNeeds(); }
    var oldest = Math.min.apply(null, ids.map(function (id) { return ST.runs[id].since; }));
    watchRuns(Date.now() - oldest > 120000 ? 10000 : 2000);
  }, ms);
}

/**
 * Open a link outside this frame. A shell that sends apiBase opens it for us,
 * from the top window and outside the frame's sandbox, and only for this
 * plugin's own /oauth/start; an older shell cannot, and the page opens it
 * itself. Never both: that is two sign-in windows.
 */
function openExternal(url) {
  if (SHELL_OPENS) { try { parent.postMessage({ type: 'eesa:open-external', url: url }, PARENT); } catch (e) {} return; }
  try { window.open(url, '_blank', 'noopener'); } catch (e) {}
}
// While Intuit has the person, the page asks every 3 seconds whether they are
// back — for ten minutes, and then it says nothing came back.
var connTimer = null;
function watchConnect(start) {
  clearTimeout(connTimer);
  if (start) ST.connecting = { since: Date.now() };
  if (!ST.connecting) return;
  connTimer = setTimeout(async function () {
    try { ST.conn = connOf(await call('quickbooks_connection', { action: 'status' })); } catch (e) {}
    if (ST.conn && ST.conn.state === 'CONNECTED') {
      ST.connecting = null;
      if (ST.conn.company_name) $('#co').textContent = ST.conn.company_name;
      toast('Connected' + (ST.conn.company_name ? ' to ' + ST.conn.company_name : ''));
      paintNow(); loadNeeds();
      return;
    }
    if (Date.now() - ST.connecting.since >= 600000) {
      ST.connecting.timedOut = true;
      tell('plugin.open_external', 'fail', 'no_return', { plugin: 'quickbooks' });
      paintNow();
      return;
    }
    watchConnect();
  }, 3000);
}

// ── keeping it live ─────────────────────────────────────────────────────
// A draft takes the assistant and the checker 20–60 seconds; a flow says what
// it is waiting on and changes on its own when it moves.
var watchTimer = null, convTimer = null;
function watch() {
  clearTimeout(watchTimer);
  var busy = connected().some(function (a) {
    return (((ST.requests[a.key] || {}).open) || []).some(function (q) { return ['DRAFTING', 'CHECKING', 'APPLYING'].indexOf(q.status) !== -1; });
  });
  if (busy) watchTimer = setTimeout(async function () {
    await Promise.all(connected().map(function (a) { return loadRequests(a.key); }));
    paintNow(); watch();
  }, 2500);
}
function watchConv() {
  clearTimeout(convTimer);
  if (ST.view !== 'conv' || !ST.items) return;
  var busy = ST.items.some(function (it) {
    return (it.type === 'request' && ['DRAFTING', 'CHECKING', 'APPLYING'].indexOf(it.request.status) !== -1)
      || (it.type === 'change' && ['APPROVED', 'EXECUTING', 'EXECUTED'].indexOf(it.change.status) !== -1)
      || (it.type === 'turn' && (it.turn.status === 'QUEUED' || it.turn.status === 'RUNNING'));
  });
  if (busy && !asking) convTimer = setTimeout(loadTimeline, 3000);
  // A flow that has just settled may now wait on the person: "Waiting on you"
  // says so at once, not at the next minute's refresh.
  if (!busy && ST.wasBusy) loadNeeds();
  ST.wasBusy = busy;
}
function refresh() {
  return ST.view === 'conv' ? loadTimeline().then(loadNeeds) : ST.view === 'calendar' ? loadCalendar().then(loadNeeds) : loadNeeds();
}

// ── asking: everything goes to the QuickBooks agent ─────────────────────
/**
 * Ask, then poll. Never wait on the answer over one connection: the edge gives
 * up on any response slower than 30 seconds and answers with a 500 of its own,
 * and an agent turn takes 12–60s. The question is stored, a worker answers it,
 * and this polls the row every two seconds — three minutes at most, then it
 * says so rather than spinning. A question outside a conversation starts one.
 */
async function sendMessage(text) {
  text = String(text || '').trim();
  if (asking || !text) return;
  asking = true; stopListening();
  $('#send').disabled = true;
  $('#box').value = ''; autosize();
  if (ST.view !== 'conv') { ST.items = []; ST.pendingTitle = text.slice(0, 80); show('conv', ''); }
  var t = { id: 'pending', question: text, status: 'QUEUED', answer: '', actions: [] };
  ST.items = (ST.items || []).concat([{ type: 'turn', at: new Date().toISOString(), turn: t }]);
  paintView(); scrollToEnd();
  var conv = ST.conv;
  try {
    // `specialist` is not sent: Eesa pins it to this plugin.
    var sent = await platform('specialist_chat_send', conv ? { question: text, conversation: conv } : { question: text });
    if (!sent.ok) throw new Error(sent.error || 'Could not send that.');
    Object.assign(t, sent.turn, { actions: [] });
    if (!conv) { conv = ST.conv = sent.turn.conversation; loadConvs(); }
    for (var i = 0; i < 90 && t.status !== 'DONE' && t.status !== 'FAILED'; i++) {
      await pause(2000);
      if (i === 15) { t.slow = true; if (ST.conv === conv) paintView(); }
      var st = await platform('specialist_chat_status', { turn_id: t.id });
      if (st.ok) Object.assign(t, st.turn);
    }
    if (t.status !== 'DONE' && t.status !== 'FAILED') {
      t.status = 'FAILED';
      t.error = 'This is taking longer than three minutes. It is still being worked on — it will be here when you come back.';
    }
    // The answer, what the agent did, and any flow it started — from the server.
    if (ST.conv === conv && ST.view === 'conv') await loadTimeline(); else paintView();
    loadConvs(); loadNeeds();
  } catch (e) {
    t.status = 'FAILED'; t.error = e.message;
    paintView();
  } finally {
    asking = false;
    $('#send').disabled = false;
    watchConv();   // a flow the answer started keeps moving on screen
  }
}

// ── the composer: type or speak ─────────────────────────────────────────
function autosize() {
  var b = $('#box'); b.style.height = 'auto'; b.style.height = Math.min(b.scrollHeight, 160) + 'px';
}
$('#box').addEventListener('input', autosize);
$('#box').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage($('#box').value); }
});
$('#composer').addEventListener('submit', function (e) { e.preventDefault(); sendMessage($('#box').value); });

// ── decisions, and the rest of what a tap does ──────────────────────────
async function pollChange(id) {
  for (var i = 0; i < 30; i++) {
    await pause(2000);
    var st = await platform('quickbooks_change_status', { change_id: id }).catch(function () { return { ok: false }; });
    if (!st.ok) return;
    var c = st.change, s = c.status;
    document.querySelectorAll('[data-change="' + c.id + '"]').forEach(function (el) {
      el.outerHTML = changeCard(c, el.getAttribute('data-mine') === '1');
    });
    if (s === 'APPROVED' || s === 'EXECUTING' || (s === 'FAILED' && i < 2)) continue;
    if (s === 'VERIFIED' || s === 'EXECUTED') toast(c.summary + ' — in QuickBooks' + (s === 'VERIFIED' ? ', checked' : ''));
    else if (s === 'FAILED') toast('QuickBooks refused ' + c.summary + (c.status_reason ? ': ' + c.status_reason : ''));
    await refresh();
    return;
  }
}
function findChange(id) {
  var q = ST.changes || {};
  var all = (q.waiting_on_me || []).concat(q.my_requests || [], q.failed || []);
  (ST.items || []).forEach(function (it) { if (it.type === 'change') all.push(it.change); });
  return all.filter(function (x) { return x.id === id; })[0];
}
function findRequest(app, id) {
  var r = ST.requests[app] || {}, all = (r.open || []).concat(r.recent || []);
  (ST.items || []).forEach(function (it) { if (it.type === 'request') all.push(it.request); });
  return all.filter(function (x) { return x.id === id; })[0];
}

// A row that acts as a button answers Enter and Space, as a button does.
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.matches && t.matches('[role="button"][data-act]')) {
    e.preventDefault();
    t.click();
  }
});

document.addEventListener('toggle', function (e) {
  var d = e.target;
  if (d.matches && d.matches('details[data-keep]')) ST.open[d.getAttribute('data-keep')] = d.open;
}, true);

document.addEventListener('click', async function (e) {
  var b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  var act = b.dataset.act, id = b.dataset.id, app = b.dataset.app;
  try {
    if (act === 'menu') { $('#shell').classList.toggle('open'); return; }
    if (act === 'new-chat') { ST.items = null; show('new'); $('#box').focus(); return; }
    if (act === 'open-needs') { show('needs'); loadNeeds(); return; }
    if (act === 'open-calendar') { return openCalendar(); }
    if (act === 'chart-all') { ST.chartAll = !ST.chartAll; return paintNow(); }
    if (act === 'chart-group') { ST.chartOpen[b.dataset.cls] = !ST.chartOpen[b.dataset.cls]; return paintNow(); }
    if (act === 'jump') { var to = document.querySelector('#view section.sec.' + b.dataset.to); if (to && to.scrollIntoView) to.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (act === 'open-conv') { return openConv(id); }
    if (act === 'more-weeks') { ST.calDays = Math.min(62, ST.calDays + 14); return loadCalendar(); }
    if (act === 'cal-row') {
      var row = HELD[b.dataset.key];
      ST.open[b.dataset.key] = !ST.open[b.dataset.key];
      paintView();
      if (ST.open[b.dataset.key] && row) loadRuns(row.source_id || row.id);
      return;
    }
    if (act === 'run-now') {
      b.disabled = true;
      try { await runNow(b.dataset.key); } catch (e) { toast(e.message); b.disabled = false; paintNow(); }
      return;
    }
    if (act === 'decide-draft') {
      var yes = b.dataset.do === 'yes';
      b.disabled = true;
      try {
        var dd = await call('quickbooks_draft_decide', { draft_id: id, decision: yes ? 'yes' : 'no' });
        ST.drafts[id] = (dd.card && dd.card.state) || (yes ? 'done' : 'cancelled');
        var res = dd.result || {};
        if (res.run_id) track(res.run_id, 'queued');
        toast(!yes ? 'Cancelled — nothing changed' : ST.drafts[id] === 'done' ? (res.message || 'Done') : own(SETTLED, ST.drafts[id]) || 'Done');
      } catch (err) {
        if (err.code === 'expired' || /expired/i.test(err.message)) ST.drafts[id] = 'expired';
        throw err;
      }
      paintNow(); loadNeeds();
      return;
    }
    if (act === 'take-over') {
      // Somebody else's work becomes yours: drafted, and yours to say yes to.
      b.disabled = true;
      var t = await call('quickbooks_schedule_change', { id: id, action: 'reassign', new_owner: (ACCESS && ACCESS.email) || '' });
      var held = t.card && t.card.type === 'draft' ? t.card : t.draft_id ? { type: 'draft', id: t.draft_id, title: t.preview } : null;
      if (held) ST.held['owner:' + id] = held;
      paintNow();
      return;
    }
    if (act === 'release') {
      var released = await dialog({ title: 'Release this day?', ok: 'Release', sub: 'Your reason stays with it, and in its note in QuickBooks.',
        body: '<label for="relWhy">Why it is right as it is</label><textarea id="relWhy" rows="2" maxlength="300"></textarea>',
        validate: function (v) { return v.querySelector('#relWhy').value.trim().length >= 3 ? null : 'why'; },
        collect: function (v) { return { why: v.querySelector('#relWhy').value.trim() }; },
        submit: function (v) { return tapped('qb_review', { app: app, action: 'release', ids: [id], reason: v.why }); } });
      if (released) { toast('Released'); await refresh(); }
      return;
    }
    if (act === 'qb-connect') {
      b.disabled = true; b.textContent = 'Opening…';
      var ticket = await call('quickbooks_connect', {});
      if (!ticket.card || !ticket.card.url) throw new Error(ticket.message || 'No link came back — try again.');
      openExternal(ticket.card.url);
      watchConnect(true);
      paintNow();
      return;
    }
    if (act === 'ask-about') {
      $('#box').value = 'Tell me more about “' + HELD[b.dataset.key] + '”'; autosize(); $('#box').focus();
      return;
    }
    if (act === 'approve' || act === 'reject' || act === 'cancel' || act === 'retry') {
      var c = findChange(id);
      if (!c) return;
      var done = await { approve: approveDialog, reject: rejectDialog, cancel: cancelDialog, retry: retryDialog }[act](c);
      if (!done) return;
      toast({ approve: 'Approved — sending it to QuickBooks', reject: 'Turned down — they have been told why',
              cancel: 'Cancelled — nothing was sent', retry: 'Sending it again' }[act]);
      await refresh();
      if (act === 'approve' || act === 'retry') pollChange(id);
      return;
    }
    if (act === 'approve-req') {
      // The card is the confirmation: it shows every step and what was checked.
      b.disabled = true; b.textContent = 'Applying…';
      var r = await call('qb_requests', { app: app, action: 'approve', id: id });
      toast(r.request.status === 'DONE' ? 'Done — each step is in its log' : 'Stopped — its log says where');
      await loadRequests(app); await refresh();
      return;
    }
    if (act === 'discard-req') {
      await call('qb_requests', { app: app, action: 'discard', id: id });
      await loadRequests(app); await refresh();
      return;
    }
    if (act === 'answer') {
      var q = findRequest(app, id);
      var input = document.querySelector('[data-answer="' + id + '"]');
      var ans = input ? input.value.trim() : '';
      if (!ans || !q) { if (input) input.focus(); return; }
      b.disabled = true;
      // The answer and the question go back together, as one request, in the
      // conversation the question was asked in.
      await call('qb_requests', { app: app, action: 'ask', words: q.words + '\n' + ans, conversation: q.conversation || ST.conv });
      await call('qb_requests', { app: app, action: 'discard', id: id }).catch(function () {});
      await loadRequests(app); await refresh(); watch();
      return;
    }
    if (act === 'sort-people') {
      // Handed to the agent like anything else said here: a new conversation.
      ST.sorting[app] = Date.now();
      return sendMessage('Match everybody who is not matched to QuickBooks yet to their QuickBooks employee, or add them '
        + 'if they are not there. Ask me about anybody you are not sure of.');
    }
    if (act === 'post') {
      // Not a journal whose amount is typed back: that is posted from its own card.
      var ids = mineReady({ key: app }).filter(function (i) { return !needsAmount(i); }).map(function (i) { return i.id; });
      if (!ids.length) return;
      b.disabled = true; b.textContent = 'Posting…';
      var out = await call('qb_review', { app: app, action: 'post', ids: ids });
      toast(plural(out.posted.length, 'entry', 'entries') + ' sent to QuickBooks' + (out.refused.length ? ' · ' + out.refused.length + ' refused: ' + out.refused[0].error : ''));
      await loadNeeds();
      setTimeout(loadNeeds, 6000);
      return;
    }
    if (act === 'skip-item') {
      var ok = await dialog({ title: 'Don’t post this?', ok: 'Don’t post', sub: 'It stays out of QuickBooks, and no task brings it back.',
        body: '<label for="skipWhy">Why, so the team knows</label><textarea id="skipWhy" rows="2" maxlength="300" placeholder="e.g. Training day, not paid"></textarea>',
        validate: function (v) { return v.querySelector('#skipWhy').value.trim().length >= 3 ? null : 'why'; },
        collect: function (v) { return { why: v.querySelector('#skipWhy').value.trim() }; },
        submit: function (v) { return call('qb_review', { app: app, action: 'exclude', ids: [id], reason: v.why }); } });
      if (ok) await loadNeeds();
      return;
    }
    if (act === 'retry-item') {
      // Asked for again, as a new change you confirm; the refused one is withdrawn.
      b.disabled = true;
      var again = await call('qb_review', { app: app, action: 'retry', ids: [id] });
      toast(again.refused.length ? again.refused[0].error : afterPost(again));
      await loadNeeds();
      return;
    }
    if (act === 'wait-act') {
      // The one tap Eesa named for why these wait (Approve these days): the card
      // is the decision, and the app it asks says what it did and skipped.
      var x = HELD[b.dataset.key];
      if (!x) return;
      WRITES[x.tool] = 1;   // an action changes something: never sent twice
      b.disabled = true; b.textContent = 'Working…';
      var did = await tapped(x.tool, x.args || {});
      toast(did.message || 'Done');
      await loadNeeds();
      return;
    }
    if (act === 'keep-task') {
      var k = HELD[b.dataset.key];
      if (!k) return;
      var kept = await dialog({ title: 'Keep “' + k.keep.name + '”?', ok: 'Delete the other', danger: true,
        sub: 'Deletes ' + k.drop.map(function (t) { return '“' + esc(t.name) + '”'; }).join(' and ')
          + '. What it brought in stays; “' + esc(k.keep.name) + '” posts this pay period from now on.',
        submit: async function () {
          for (var n = 0; n < k.drop.length; n++) await tapped('qb_tasks', { app: app, action: 'delete', id: k.drop[n].id });
        } });
      if (kept) { toast('Deleted — “' + k.keep.name + '” posts it'); await loadNeeds(); }
      return;
    }
    if (act === 'post-journal') {
      var je = mineReady({ key: app }).filter(function (i) { return i.id === id; })[0];
      if (!je) return;
      var expected = Number((je.needs && je.needs.amount) || je.amount).toFixed(2), posted = null;
      var done = await dialog({ title: 'Post ' + je.title + '?', ok: 'Post it',
        sub: je.needs && je.needs.approvals > 1 ? 'Your confirmation is its first approval; a second approver approves it next.' : 'It is sent once you confirm.',
        body: '<label for="jeAmt">Type the amount to confirm: ' + esc(expected) + '</label>'
          + '<input id="jeAmt" inputmode="decimal" placeholder="' + esc(expected) + '" autocomplete="off">',
        validate: function (v) { return normalizeAmount(v.querySelector('#jeAmt').value) === expected ? null : 'amount'; },
        collect: function (v) { return { amount: v.querySelector('#jeAmt').value.trim() }; },
        submit: async function (v) {
          posted = await call('qb_review', { app: app, action: 'post', ids: [id], confirmed_amount: v.amount });
          if (posted.refused.length) throw new Error(posted.refused[0].error);
        } });
      if (done) { toast(afterPost(posted)); await loadNeeds(); }
      return;
    }
    if (act === 'draft') {
      await call('qb_pay_save', { what: b.dataset.what, action: b.dataset.do, id: id });
      toast(b.dataset.do === 'confirm' ? 'Confirmed' : 'Discarded');
      await loadNeeds();
      return;
    }
    if (act === 'connect') {
      b.disabled = true; b.textContent = 'Connecting…';
      await call('qb_app_connect', { app: app, action: 'connect' });
      toast('Connected — read only');
      await loadNeeds(); paintView();
      return;
    }
    if (act === 'toggle' || act === 'steps') { ST.open[b.dataset.key] = !ST.open[b.dataset.key]; paintView(); return; }
    if (act === 'sched-do') {
      var sk = b.dataset.key, sc = HELD[sk];
      if (!sc) return;   // drawn disabled while its call is out, and a disabled button is not heard
      ST.busy[sk] = true;
      paintView();
      try {
        // The owner's own pause and resume happen at once (Eesa says so in the answer). Anything
        // that comes back as a card instead is left for the person to read and decide.
        var did = await call('quickbooks_schedule_change', { id: sc.id, action: b.dataset.do });
        if (did && (did.draft_id || (did.card && did.card.type === 'draft'))) {
          ST.held['sched:' + sc.id] = did.card || { type: 'draft', id: did.draft_id, title: did.message || 'Go ahead?' };
          toast('Check the card under Needs you');
        } else toast((did && did.message) || (b.dataset.do === 'pause' ? 'Paused' : 'Resumed'));
      } finally { delete ST.busy[sk]; }

    }
    if (act === 'say') {
      var box = $('#box');
      if (!box.value.trim()) box.value = b.dataset.say || '';

    }
    if (act === 'start') {
      var pick = starts()[Number(b.dataset.i)];
      if (pick) { $('#box').value = pick[1]; autosize(); $('#box').focus(); }
      return;
    }
  } catch (err) {
    // The expected outcomes of a race, said as what they are.
    if (err.code === 'already_executed') toast('Somebody else approved this first. It has already been sent.');
    else if (err.code === 'changed_since') toast('This changed in QuickBooks since it was proposed. Ask for it again.');
    else toast(err.message);
    refresh().catch(function () {});
  }
});

// ── first paint ─────────────────────────────────────────────────────────

    if (info && info.CompanyName) $('#co').textContent = info.CompanyName;
  }).catch(function (e) {
    // The name is nice to have. What its refusal says is not: no role
    // recorded at all, or no company connected here.
    if (e.code === 'role_forbids' && !(ACCESS && ACCESS.role_key)) ST.noAccess = true;
    if (e.code === 'role_forbids' || e.code === 'not_connected_here') paintNow();
  });
  applyRoute(ROUTE);
  await loadNeeds();
  paintView();
  // Keep what needs you, and the history, current while the page stays open.
  setInterval(function () {
    if (!asking && document.visibilityState === 'visible') { loadNeeds(); loadConvs(); }
  }, 60000);
}

// ── what needs you ──────────────────────────────────────────────────────
// Everything here is read, not generated: the agents made the drafts, the
// tasks brought the hours in, and this only lays each out as one decision.
async function loadNeeds() {
  await Promise.all([
    platform('quickbooks_changes', { limit: 25 }).then(function (r) { ST.changes = r; delete ST.errors.changes; })
      .catch(function (e) { ST.errors.changes = e.message; }),
    ACCESS && ACCESS.has_access ? call('qb_apps', {}).then(function (r) { ST.apps = r; delete ST.errors.apps; })
      .catch(function (e) { ST.errors.apps = e.message; }) : null,
    // No QuickBooks read in these: the same minute's poll can afford them.
    newer('quickbooks_calendar', { days: 7, include: ['schedule', 'runs', 'approvals'] }, 'cal'),
    // Paused ones too: the line counts them, and a paused schedule is still theirs.
    newer('quickbooks_schedule', { include_paused: true }, 'sched'),
    connDue() ? newer('quickbooks_connection', { action: 'status' }, 'conn') : null,
    chartDue() ? newer('qb_chart', { view: 'structure' }, 'chart') : null,
  ]);
  if (ST.conn) ST.conn = connOf(ST.conn);
  if (ST.conn && ST.conn.company_name) $('#co').textContent = ST.conn.company_name;
  paintNow();
  var v = viewer(), conn = connected();
  await Promise.all(conn.map(function (a) {
    return Promise.all([
      loadRequests(a.key),
      a.counts && (a.counts.ready_for_me || a.counts.failed || a.counts.waiting) ? loadReview(a.key) : null,
      v.sees_staff ? call('qb_people', { app: a.key }).then(function (r) { ST.people[a.key] = r; }).catch(function () { delete ST.people[a.key]; }) : null,
    ]);
  }).concat(conn.length && v.sees_pay ? [call('qb_pay_setup', {}).then(function (r) { ST.setup = r; }).catch(function () { ST.setup = null; })] : []));
  paintNow();
  watch();
}
/** The chart reads QuickBooks: on opening, then at most every ten minutes (Eesa keeps the same ten-minute copy). */
function chartDue() {
  if (ST.chartAt && Date.now() - ST.chartAt < 600000) return false;
  ST.chartAt = Date.now();
  return true;
}
/** A live QuickBooks check costs a call to Intuit: once on opening, then at most every five minutes. */
function connDue() {
  if (ST.connAt && Date.now() - ST.connAt < 300000) return false;
  ST.connAt = Date.now();
  return true;
}
/** A tool from a newer Eesa: kept in ST[key] when there, left out quietly when this Eesa has not got it yet. */
function newer(tool, args, key) {
  if (MISSING[tool]) return null;
  return call(tool, args).then(function (r) { ST[key] = r; delete ST.errors[key]; })
    .catch(function (e) { if (e.code !== 'not_available') ST.errors[key] = e.message; });
}
function viewer() { return (ST.apps && ST.apps.viewer) || {}; }
function connected() { return ((ST.apps && ST.apps.apps) || []).filter(function (a) { return a.connected; }); }
async function loadRequests(app) {
  try { ST.requests[app] = await call('qb_requests', { app: app }); }
  catch (e) { ST.requests[app] = { failed: e.message, open: [], recent: [] }; }
}
async function loadReview(app) {
  try { ST.review[app] = await call('qb_review', { app: app, status: 'open' }); }
  catch (e) { ST.review[app] = { failed: e.message, items: [] }; }
}

/** The cards, in the order a person would want to deal with them. */
function needCards() {
  var out = [];   // { key, html, decide }
  var me = (ACCESS && ACCESS.email) || '';
  var ch = ST.changes || {}, sc = ST.sched || {};
  // Nothing works until QuickBooks is connected, so that comes first.
  if (needsConnect()) out.push({ key: 'connect', html: qbConnectCard(), decide: canConnect() });
  // A card already showing under the answer that made it is not drawn twice,
  // but it still needs the person, so it still counts.
  (ch.waiting_on_me || []).forEach(function (c) {
    out.push({ key: 'c:' + c.id, html: changeCard(c, false), decide: !!c.can_decide, inline: !!ST.inline['c:' + c.id] });
  });
  var retry = {};
  (ch.failed || []).concat((ch.my_requests || []).filter(retryable)).forEach(function (c) {
    if (c.can_retry && !retry[c.id]) {
      retry[c.id] = true;
      out.push({ key: 'c:' + c.id, html: changeCard(c, false), decide: true, inline: !!ST.inline['c:' + c.id] });
    }
  });
  // What the agents drafted for this person, in any conversation.
  (sc.drafts || []).forEach(function (d) {
    out.push({ key: 'd:' + d.id, html: draftCard(d), decide: (ST.drafts[d.id] || d.state || 'pending') === 'pending' });
  });
  // My scheduled work that did not run; and work whose owner no longer can.
  (sc.items || sc.schedules || []).forEach(function (s) {
    if (!s.paused && s.owner && s.owner.is_me && s.last && RERUN.indexOf(s.last.status) !== -1) out.push({ key: 's:' + s.id, html: scheduleCard(s), decide: true });
  });
  (sc.owner_needed || []).forEach(function (o) { out.push({ key: 'o:' + o.id, html: ownerCard(o), decide: true }); });
  connected().forEach(function (a) {
    var rv = ST.review[a.key] || {};
    (rv.items || []).forEach(function (i) {
      if (i.status === 'WAITING' && String(i.verdict || '').toUpperCase() === 'AMBER') {
        out.push({ key: 'i:' + i.id, html: itemsCard({ app: a.key, items: [i] }), decide: true });
      }
    });
    (a.overlaps || []).forEach(function (o, n) {
      out.push({ key: 'ov:' + a.key + ':' + n, html: overlapCard(a, o, n), decide: o.tasks.some(function (t) { return t.mine; }) });
    });
    var r = ST.requests[a.key];
    if (r && r.failed) out.push({ key: 'rq:' + a.key, html: '<div class="card"><div class="kicker">' + esc(a.name) + '</div><p class="say bad">' + esc(r.failed) + '</p></div>' });
    ((r && r.open) || []).forEach(function (q) {
      out.push({ key: 'r:' + q.id, html: requestCard(q, a.key), decide: q.status === 'READY' || q.status === 'NEEDS_INFO', inline: !!ST.inline['r:' + q.id] });
    });
    var c = a.counts || {};
    // A journal whose amount the rules want typed back is its own card: one decision each.
    var typed = mineReady(a).filter(needsAmount);
    typed.forEach(function (i) { out.push({ key: 'je:' + i.id, html: journalCard(a, i), decide: true }); });
    if (c.ready_for_me && (!rv.items || c.ready_for_me > typed.length)) out.push({ key: 'post:' + a.key, html: postCard(a), decide: true });
    if (c.failed) out.push({ key: 'fail:' + a.key, html: failedCard(a), decide: true });
    // Nobody matched yet — offered even while an unrelated request is open;
    // only people an open request is already about are left to it.
    var p = ST.people[a.key], sorting = false;
    if (p && viewer().matches) {
      var covered = {};
      ((r && r.open) || []).forEach(function (q) { (q.refs || []).forEach(function (x) { covered[x] = true; }); });
      var loose = (p.people || []).filter(function (x) {
        return x.on_roster !== false && (!x.match || x.match.status === 'SUGGESTED') && !covered[x.ref];
      });
      var asked = ST.sorting[a.key] && Date.now() - ST.sorting[a.key] < 300000;
      sorting = !!(loose.length && !asked);
      if (sorting) out.push({ key: 'people:' + a.key, html: peopleCard(a, loose), decide: true });
    }
    // Why the rest wait: one card per reason, saying what moves it.
    (rv.waiting || []).forEach(function (g) {
      var card = waitCard(a, g, sorting);
      if (card) out.push(card);
    });
    draftCards(a).forEach(function (d) { out.push(d); });
  });
  ((ST.apps && ST.apps.apps) || []).forEach(function (a) {
    if (!a.connected && viewer().can_connect) out.push({ key: 'connect:' + a.key, html: connectCard(a), decide: false });
  });
  void me;
  return out;
}

/** What this person's own tasks brought in and is ready for them to post. */
function mineReady(a) {
  var me = (ACCESS && ACCESS.email) || '';
  return ((ST.review[a.key] || {}).items || []).filter(function (i) { return i.status === 'REVIEW' && i.task && i.task.owner === me; });
}
/** The approval rules want its amount typed back (a journal entry always). */
function needsAmount(i) { return !!(i.needs && i.needs.type_amount); }
/** Hours or wages a task brought in, ready for their owner to send. */
function postCard(a) {
  var rv = ST.review[a.key] || {};
  var items = mineReady(a).filter(function (i) { return !needsAmount(i); });
  var n = rv.items ? items.length : a.counts.ready_for_me;
  var kind = items[0] ? (items[0].noun || items[0].kind) : 'entry';
  var total = items.reduce(function (s, i) { return s + Number(i.amount || 0); }, 0);
  var list = '';

    list = '<div class="rows">' + items.slice(0, 60).map(function (i) {

}

/** What a post came to, in one line: sent, or waiting for whom. */
function afterPost(out) {
  var w = (out && out.waiting) || [];
  if (w.length) return 'Confirmed — it waits for ' + (names(w[0].approvers || []) || 'a second approver') + ' to approve it';

}
/** What could not be posted, and why — never left for somebody to notice. */
function failedCard(a) {

  return '<div class="card"><div class="kicker">' + esc(a.name) + ' → QuickBooks</div>'

}

/** People nobody has said who they are in QuickBooks — handed to the assistant. */
function peopleCard(a, loose) {
  return '<div class="card"><div class="kicker">' + esc(a.name) + '</div>'
    + '<h3>' + esc(names(loose.map(function (x) { return x.name; }))) + (loose.length === 1 ? ' isn’t' : ' aren’t') + ' matched to QuickBooks employees</h3>'
    + '<p class="say">Until they are, their hours can’t be posted.</p>'
    + '<div class="actions"><span class="meta">The assistant drafts who each person is, a checker looks, and you approve.</span>'
    + '<button class="btn primary" data-act="sort-people" data-app="' + esc(a.key) + '">Sort them out</button></div></div>';
}
/** "A", "A and B", "A, B and C", "A, B, C, D and 2 more". */
function names(list) {
  var l = list.filter(Boolean), more = l.length > 4 ? l.length - 4 : 0;
  if (more) return l.slice(0, 4).join(', ') + ' and ' + more + ' more';
  return l.length < 2 ? (l[0] || '') : l.slice(0, -1).join(', ') + ' and ' + l[l.length - 1];
}
function shortDay(iso) {
  var d = new Date(String(iso) + 'T12:00:00Z');
  return isNaN(d) ? String(iso || '') : d.getUTCDate() + ' ' + d.toLocaleString('en', { month: 'short', timeZone: 'UTC' });
}

/**
 * Why items wait, one card per reason, grouped by Eesa (qb_review's
 * `waiting`): the reason in words, who and which days, what moves it
 * (`next`), and — for somebody who may — the one tap that does (`act`,
 * e.g. Approve these days). The page names no app: Eesa says all of it.
 */
function waitCard(a, g, sorting) {
  if (g.why === 'overlap' || g.why === 'adding') return null;   // the overlap card has the buttons; adding is on its way
  if (g.why === 'match' && (sorting || g.can_match)) return null;   // the Sort them out card says it, with its button
  var who = (g.people || []).map(function (p) { return esc(p.name) + (p.days ? ' ' + p.days : ''); }).join(' · ');
  var span = g.from ? (g.from === g.to ? shortDay(g.from) : shortDay(g.from) + ' – ' + shortDay(g.to)) : '';
  var said = (g.said || []).length ? '<ul class="feeds">' + g.said.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '';
  var tap = g.act && g.act.tool
    ? '<div class="actions">' + (g.next ? '<span class="meta">' + esc(g.next) + '</span>' : '')
      + '<button class="btn primary" data-act="wait-act" data-app="' + esc(a.key) + '" data-key="'
      + esc(keep('act:' + a.key + ':' + g.why, g.act)) + '">' + esc(g.act.label || 'Go ahead') + '</button></div>'
    : g.why === 'pay' ? said + '<div class="actions"><button class="btn" data-act="say" data-say="Set the pay for '
      + esc(names((g.people || []).map(function (p) { return p.name; }))) + '">Say it</button></div>'
    : (g.next ? '<p class="say">' + esc(g.next) + '</p>' : said);
  return { key: 'w:' + a.key + ':' + g.why, decide: !!(g.act && g.act.tool) || g.why === 'pay', html:
    '<div class="card" data-wait="' + esc(g.why) + '"><div class="kicker">' + esc(a.name) + ' → QuickBooks</div><h3>' + esc(g.words) + '</h3>'
    + (who || span ? '<p class="say">' + [who, esc(span)].filter(Boolean).join(' · ') + '</p>' : '') + tap + '</div>' };
}

/** Two wage tasks post the same pay period: nothing posts until one is kept. */
function overlapCard(a, o, n) {
  var tasks = o.tasks || [];
  var buttons = tasks.map(function (t) {
    var drop = tasks.filter(function (x) { return x.id !== t.id; });

    return '<button class="btn" data-act="keep-task" data-app="' + esc(a.key) + '" data-key="'
      + esc(keep('keep:' + a.key + ':' + n + ':' + t.id, { keep: t, drop: drop })) + '">Keep “' + esc(t.name) + '”</button>';
  }).join('');
  return '<div class="card" data-overlap="' + n + '"><div class="kicker">' + esc(a.name) + ' → QuickBooks</div>'
    + '<h3>' + esc(o.words) + '</h3><div class="rows">' + tasks.map(function (t) {
      return '<div class="rowx"><div class="main">“' + esc(t.name) + '”<small>' + esc(t.accounts || '') + ' · '
        + esc(t.mine ? 'yours' : t.owner_name || t.owner) + '</small></div></div>';
    }).join('') + '</div><p class="say">Nothing posts for it until one is kept.</p>'
    + (buttons ? '<div class="actions">' + buttons + '</div>'
      : '<p class="say">Only ' + esc(names(tasks.map(function (t) { return t.owner_name || t.owner; })
          .filter(function (w, k, all) { return all.indexOf(w) === k; }))) + ' can delete their task.</p>')
    + '</div>';
}

/** Drafts from before requests existed — still somebody's to confirm. */
function draftCards(a) {

        + '<div class="actions"><button class="btn" data-act="draft" data-do="discard" data-what="' + what + '" data-id="' + esc(d.id) + '">Discard</button>'

    });
  }
  ((ST.people[a.key] || {}).people || []).forEach(function (x) {
    var d = x.draft_pay;

    out.push({ key: 'draft:' + d.id, decide: true, html: '<div class="card"><div class="kicker">Drafted — waiting for you</div>'
      + '<h3>' + esc(x.name) + ': ' + esc(d.words) + '</h3><p class="say">From ' + esc(d.effective_from) + '</p>'
      + '<div class="actions"><button class="btn" data-act="draft" data-do="discard" data-what="terms" data-id="' + esc(d.id) + '">Discard</button>'
      + '<button class="btn primary" data-act="draft" data-do="confirm" data-what="terms" data-id="' + esc(d.id) + '">Confirm</button></div></div>' });
  });

}

/** An app that could send its money side to QuickBooks — the admin's consent. */
function connectCard(a) {
  return '<div class="card"><div class="kicker">Could be connected</div>'
    + '<h3>' + esc(a.name) + ' can send ' + esc(a.what.charAt(0).toLowerCase() + a.what.slice(1)) + ' to QuickBooks</h3>'

// ── decisions ───────────────────────────────────────────────────────────
function normalizeAmount(t) {
  var v = parseFloat(String(t || '').replace(/[^0-9.\-]/g, ''));
  return isFinite(v) ? v.toFixed(2) : '';
}
function facts(c) {
  var rows = [['Type', (c.operation === 'update' ? 'Edit ' : (c.operation === 'delete' || c.operation === 'void') ? 'Void/delete ' : 'New ') + esc(c.kind || 'change')]];
  if (c.counterparty_name) rows.push([c.counterparty_kind === 'vendor' ? 'Vendor' : 'Customer', esc(c.counterparty_name)]);
  rows.push(['Company', esc($('#co').textContent || 'QuickBooks')]);
  rows.push(['Asked for by', esc(c.requested_by_name || c.requested_by)]);
  if (c.before && c.before.DocNumber) rows.push(['Document', 'No. ' + esc(c.before.DocNumber) + (c.before.TxnDate ? ' · ' + esc(c.before.TxnDate) : '')]);
  return '<div class="facts">' + rows.map(function (r) { return '<div class="fact"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>'; }).join('')
    + '<div class="fact amt"><span>Amount</span><span>' + money(c.amount) + '</span></div></div>';
}
/** A dialog; resolves with the submitted values, or null when cancelled. */
function dialog(o) {
  return new Promise(function (resolve) {
    var veil = document.createElement('div'); veil.className = 'veil';
    veil.innerHTML = '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">'
      + '<h2 id="dlgT">' + esc(o.title) + '</h2>' + (o.sub ? '<p class="sub">' + o.sub + '</p>' : '')
      + (o.body || '') + '<div class="err" id="dlgErr" hidden></div>'
      + '<div class="foot"><button class="btn" data-x="cancel">Cancel</button>'
      + '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-x="ok" id="dlgOk">' + esc(o.ok) + '</button></div></div>';
    document.body.appendChild(veil);
    var okBtn = veil.querySelector('#dlgOk');
    function close(v) { document.removeEventListener('keydown', onKey); veil.remove(); resolve(v); }
    function onKey(e) { if (e.key === 'Escape') close(null); }
    document.addEventListener('keydown', onKey);
    veil.addEventListener('click', function (e) { if (e.target === veil) close(null); });
    veil.querySelector('[data-x=cancel]').onclick = function () { close(null); };
    var check = function () { var v = o.validate ? o.validate(veil) : null; okBtn.disabled = !!v; return v; };
    veil.addEventListener('input', check); check();
    okBtn.onclick = async function () {
      var vals = o.collect ? o.collect(veil) : {};
      okBtn.disabled = true; okBtn.textContent = 'Working…';
      try { await o.submit(vals); close(vals); }
      catch (err) {
        var el = veil.querySelector('#dlgErr'); el.textContent = err.message; el.hidden = false;
        okBtn.disabled = false; okBtn.textContent = o.ok;
      }
    };
    var first = veil.querySelector('input, textarea'); if (first) first.focus(); else okBtn.focus();
  });
}
async function decide(args) {
  var r = await platform('quickbooks_change_decide', args);
  if (!r.ok) { var e = new Error(r.error || 'That did not go through.'); e.code = r.code; throw e; }
  return r;
}
// Approving is the moment money moves, so the dialog restates the change in
// full, and for a high-risk change it makes them type the amount back — the
// one failure a policy engine cannot catch is clicking through $50,000 read as
// $5,000. Turning down needs a reason: it is all the asker has to work from.
function approveDialog(c) {
  var isFinal = (c.approvals_received + 1) >= c.required_approvals;
  var expected = Number(c.amount).toFixed(2);
  return dialog({
    title: isFinal ? 'Approve and send to QuickBooks' : 'Record your approval',
    sub: isFinal ? 'This is the final approval. Approving sends the change to QuickBooks now.'
                 : 'This change needs ' + c.required_approvals + ' approvals. Yours will be ' + (c.approvals_received + 1) + ' of ' + c.required_approvals + '.',
    ok: isFinal ? 'Approve and send' : 'Approve',
    body: facts(c)
      + ((c.validation && c.validation.warnings && c.validation.warnings.length)
          ? '<div class="strip warn"><b>Check before approving</b>' + c.validation.warnings.map(function (w) { return '<div>• ' + esc(w) + '</div>'; }).join('') + '</div>' : '')
      + (c.high_risk ? '<label for="dlgAmt">Type the amount to confirm: ' + esc(expected) + '</label>'
          + '<input id="dlgAmt" inputmode="decimal" placeholder="' + esc(expected) + '" autocomplete="off">'
          + '<div class="hintx" id="dlgAmtHint">High-risk changes need the amount typed back before they can be approved.</div>' : '')
      + '<label for="dlgNote">Note (optional)</label><textarea id="dlgNote" rows="2" maxlength="500"></textarea>',
    validate: function (v) {
      if (!c.high_risk) return null;
      var t = v.querySelector('#dlgAmt').value, h = v.querySelector('#dlgAmtHint');
      var ok = normalizeAmount(t) === expected;
      h.textContent = (t && !ok) ? 'That does not match the amount.' : 'High-risk changes need the amount typed back before they can be approved.';
      h.style.color = (t && !ok) ? 'var(--out)' : '';
      return ok ? null : 'amount';
    },
    collect: function (v) { return { confirmed_amount: c.high_risk ? v.querySelector('#dlgAmt').value : undefined, note: v.querySelector('#dlgNote').value.trim() || undefined }; },
    submit: function (vals) { return decide({ change_id: c.id, decision: 'approve', confirmed_amount: vals.confirmed_amount, note: vals.note }); },
  });
}
function rejectDialog(c) {
  return dialog({
    title: 'Turn down this change', sub: esc(c.summary) + ' — ' + money(c.amount) + '. Nothing will be sent to QuickBooks.', ok: 'Turn down', danger: true,
    body: '<label for="dlgReason">Why</label><textarea id="dlgReason" rows="3" maxlength="1000" placeholder="e.g. Wrong customer — this should be billed to the parent company."></textarea>'
      + '<div class="hintx">Shared with whoever asked for it, and recorded.</div>',
    validate: function (v) { return v.querySelector('#dlgReason').value.trim().length >= 3 ? null : 'reason'; },
    collect: function (v) { return { reason: v.querySelector('#dlgReason').value.trim() }; },
    submit: function (vals) { return decide({ change_id: c.id, decision: 'reject', reason: vals.reason }); },
  });
}
function cancelDialog(c) {
  return dialog({ title: 'Cancel this request?', sub: 'Nothing has been sent to QuickBooks.', ok: 'Cancel request', danger: true,
                  submit: function () { return decide({ change_id: c.id, decision: 'cancel' }); } });
}
function retryDialog(c) {
  var unknown = c.last_execution && c.last_execution.status === 'INDETERMINATE';
  return dialog({
    title: 'Send to QuickBooks again?',
    sub: unknown ? 'The last attempt’s outcome was unknown. Eesa will first look in QuickBooks for the document, and only send again if it is not there.'
                 : 'The last attempt failed: ' + esc((c.last_execution && c.last_execution.error) || c.status_reason || '') + '. The same approved change is sent again.',
    ok: 'Try again', body: facts(c),
    submit: function () { return decide({ change_id: c.id, decision: 'retry' }); },
  });
}

/**
 * Speaking is typing by voice: the words land in the box, where they can be
 * read and fixed before they are sent. The browser does the listening; where it
 * cannot — or Eesa has not been allowed the microphone — the button says so
 * once and goes away, rather than failing every time it is pressed.
 */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
function hint(text) { var h = $('#hint'); h.textContent = text || ''; h.hidden = !text; }
function stopListening() { if (rec) { try { rec.stop(); } catch (e) {} } }
if (SR) {
  $('#mic').hidden = false;
  $('#mic').addEventListener('click', function () {
    if (rec) { stopListening(); return; }
    var base = $('#box').value.trim();
    rec = new SR();
    rec.lang = navigator.language || 'en-US';
    rec.interimResults = true; rec.continuous = true;
    rec.onresult = function (e) {
      var said = '';
      for (var i = 0; i < e.results.length; i++) said += e.results[i][0].transcript;
      $('#box').value = (base ? base + ' ' : '') + said.trim(); autosize();
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') {
        hint('The microphone isn’t available here — allow it for Eesa in your browser, or type instead.');
        $('#mic').hidden = true;
      } else if (e.error !== 'aborted' && e.error !== 'no-speech') hint('Didn’t catch that — try again, or type it.');
    };
    rec.onend = function () { rec = null; $('#mic').classList.remove('on'); $('#mic').setAttribute('aria-label', 'Speak'); };
    try { rec.start(); hint(''); $('#mic').classList.add('on'); $('#mic').setAttribute('aria-label', 'Stop listening'); }
    catch (e) { rec = null; hint('The microphone isn’t available here — type instead.'); }
  });
}

</script>
</body>
</html>
