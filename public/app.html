<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QuickBooks</title>
<!--
  QuickBooks in Eesa — asked, not operated.

  THE SHAPE (Eesa's rule since 2026-09-25: the interface is agentic)
    One place to type or speak. The QuickBooks agent answers from the books
    and hands setup ("add Alex, $18 an hour") to the attendance assistant,
    whose draft a checker reviews. Anything that would change QuickBooks or
    somebody's pay waits here as a card with one decision on it. No tabs, no
    menus, no settings screens: the page says where things stand, shows what
    needs you, answers what you ask, and says what was done.

  NO CREDENTIAL EVER REACHES THIS PAGE
    1. The Eesa shell posts { type:'eesa:session', token, theme, apiBase }.
    2. Every call goes to POST {eesa}/api/v1/gateway/plugin-ui-invoke/ with
       that short-lived token. Eesa checks the person's recorded QuickBooks
       role, injects this plugin's key server-side, and proxies the call.
    3. So a "Reports only" person sees exactly what "Reports only" covers. The
       page asks for the role FIRST and only asks for what it covers — the gate
       would refuse the rest anyway, and a wall of refusals teaches nothing.

  THE ARGUMENT ENVELOPE IS NOT WHAT IT LOOKS LIKE
    Intuit's tools take { params: {...} }, not the arguments directly. Eesa's
    OWN tools are the opposite and take plain arguments. Two call paths below,
    invoke() and platform(), deliberately. Do not merge them.

  THIS REPOSITORY IS PUBLIC — no real names, emails or figures in this file.
-->
<style>
  /* Apple's grouped surfaces with Intuit's green as the one accent, so it still
     reads as QuickBooks to somebody who uses a phone all day. */
  :root {
    --qb: #2CA01C; --qb-press: #108000; --qb-soft: rgba(44,160,28,.10);
    --bg: #F2F2F7; --group: #FFFFFF; --raised: #FFFFFF;
    --label: #1C1C1E; --label2: #6C6C70; --label3: #8E8E93;
    --sep: #D9D9DE; --fill: #EFEFF4;
    --in: #1B8A3E; --out: #C4351C; --warn: #B25000;
    --r: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 14px rgba(0,0,0,.035);
    --safe: env(safe-area-inset-bottom, 0px);
    --dock: rgba(242,242,247,.88);
  }
  :root[data-theme="dark"] {
    --qb: #35C22B; --qb-press: #2CA01C; --qb-soft: rgba(53,194,43,.16);
    --bg: #000000; --group: #1C1C1E; --raised: #2C2C2E;
    --label: #FFFFFF; --label2: #AEAEB2; --label3: #8E8E93;
    --sep: #38383A; --fill: #2C2C2E;
    --in: #32D74B; --out: #FF6961; --warn: #FF9F0A;
    --shadow: none; --dock: rgba(0,0,0,.84);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .page { max-width: 720px; margin: 0 auto; padding: 0 16px calc(176px + var(--safe)); }

  /* Who and where, never in the way. */
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 11px;
         padding: 12px 0 10px; background: var(--bg); }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--qb); color: #fff; flex: none;
          display: grid; place-items: center; font-weight: 800; font-size: 15px; letter-spacing: -.03em; }
  .top .t { flex: 1; min-width: 0; }
  .co { font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .role { font-size: 13px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--fill); color: var(--label);
            display: grid; place-items: center; font-size: 15px; font-weight: 650; border: 0; cursor: pointer; flex: none; }

  /* The page speaks first. */
  #now { scroll-margin-top: 64px; }
  .brief { padding: 10px 2px 2px; }
  .hello { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.025em; margin: 0 0 10px; text-wrap: balance; }
  .brief p { margin: 0 0 6px; }
  .brief b { font-weight: 650; font-variant-numeric: tabular-nums; }
  .brief .quiet { color: var(--label2); font-size: 15px; }
  .in { color: var(--in); } .out { color: var(--out); }
  .skel { height: 13px; border-radius: 7px; background: var(--fill); margin: 10px 0; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .label { font-size: 13px; font-weight: 650; color: var(--label2); text-transform: uppercase; letter-spacing: .05em;
           margin: 22px 4px 8px; display: flex; align-items: center; gap: 8px; }
  .label .n { background: var(--qb); color: #fff; border-radius: 999px; font-size: 11.5px; min-width: 19px; height: 19px;
              padding: 0 6px; display: inline-grid; place-items: center; letter-spacing: 0; }

  /* A card: one thing, one decision. */
  .card { background: var(--group); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; }
  .kicker { font-size: 12.5px; font-weight: 650; color: var(--label3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
  .card h3 { margin: 0; font-size: 16.5px; line-height: 1.3; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .card .say { margin: 6px 0 0; font-size: 15px; color: var(--label2); }
  .card .ask { margin: 8px 0 0; font-size: 16px; }
  .working::after { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 99px; background: var(--qb);
                    margin-left: 8px; vertical-align: middle; animation: pulse 1s infinite; }
  .steps { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15px; }
  .steps li.ok, .steps li.bad { list-style: none; margin-left: -20px; }
  .steps li.ok { color: var(--in); } .steps li.bad { color: var(--out); }
  .found { margin-top: 10px; border-radius: 12px; padding: 10px 12px; font-size: 14.5px; background: var(--fill); }
  .found.ok { background: rgba(27,138,62,.08); } .found.warn { background: rgba(178,80,0,.08); } .found.bad { background: rgba(196,53,28,.08); }
  .found > b { display: block; margin-bottom: 4px; }
  .found.ok > b { color: var(--in); } .found.warn > b { color: var(--warn); } .found.bad > b { color: var(--out); }
  .f { display: flex; gap: 8px; margin-top: 3px; }
  .f > span:first-child { width: 14px; flex: none; font-weight: 700; }
  .f.ok > span:first-child { color: var(--in); } .f.warn > span:first-child { color: var(--warn); } .f.stop > span:first-child { color: var(--out); }
  .f em { font-style: normal; font-size: 12px; color: var(--label3); margin-left: 4px; }
  .rows { margin-top: 10px; border-top: 1px solid var(--sep); }
  .rowx { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--sep); font-size: 15px; }
  .rowx .main { flex: 1; min-width: 0; } .rowx small { display: block; color: var(--label2); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .answer { display: flex; gap: 8px; margin-top: 10px; }
  .answer input { flex: 1; min-width: 0; border: 1px solid var(--sep); border-radius: 12px; padding: 10px 12px; background: var(--bg); }

  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .actions .meta { flex: 1 1 200px; text-align: left; font-size: 13px; color: var(--label2); }
  .btn { border: 1px solid var(--sep); background: var(--group); border-radius: 12px; padding: 9px 14px; cursor: pointer;
         font-size: 15px; line-height: 1.1; }
  .btn.primary { background: var(--qb); border-color: var(--qb); color: #fff; font-weight: 650; }
  .btn.primary:active { background: var(--qb-press); }
  .btn.link { border: 0; background: transparent; color: var(--qb); font-weight: 600; padding: 6px 4px; }
  .btn.danger { background: var(--out); border-color: transparent; color: #fff; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600;
          background: var(--fill); color: var(--label2); white-space: nowrap; }
  .pill.wait { color: var(--warn); } .pill.yes { color: var(--in); } .pill.no { color: var(--out); } .pill.qb { color: var(--qb); background: var(--qb-soft); }
  .meta { font-size: 13px; color: var(--label2); margin-top: 2px; }
  .msg { color: var(--label2); font-size: 15px; padding: 4px 2px; }
  .msg.bad { color: var(--out); }
  details.more > summary { list-style: none; cursor: pointer; color: var(--label2); font-size: 14px; padding: 6px 4px; }
  details.more > summary::-webkit-details-marker { display: none; }

  /* A change to QuickBooks — the amount is the largest thing on it, the status a stripe. */
  .change { background: var(--group); border-radius: var(--r); box-shadow: var(--shadow); padding: 13px 15px 12px; margin-bottom: 10px; }
  .chead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .chead b { font-size: 16px; display: block; margin-top: 4px; }
  .amt { font-size: 24px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lines { margin: 10px 0 0; border-top: 1px solid var(--sep); }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--sep); font-size: 14px; }
  .strip { margin-top: 10px; border-radius: 10px; padding: 9px 12px; font-size: 14px; line-height: 1.4; }
  .strip b { display: block; margin-bottom: 2px; }
  .strip.bad { background: rgba(196,53,28,.08); color: var(--out); }
  .strip.warn { background: rgba(178,80,0,.08); color: var(--warn); }
  .strip.ok { background: rgba(27,138,62,.08); color: var(--in); }

  /* What was asked, and what was answered. */
  .thread { display: flex; flex-direction: column; gap: 10px; }
  #earlier:not(:empty) { margin: 8px 0 4px; }
  .turn { max-width: 88%; }
  .turn.me { align-self: flex-end; }
  .bubble { background: var(--group); border-radius: 19px; padding: 11px 15px; box-shadow: var(--shadow); font-size: 16px; overflow-wrap: anywhere; }
  .turn.me .bubble { background: var(--qb); color: #fff; }
  .bubble > :first-child { margin-top: 0; } .bubble > :last-child { margin-bottom: 0; }
  .bubble p { margin: 8px 0; } .bubble h3 { font-size: 15px; margin: 12px 0 6px; }
  .bubble ul { margin: 8px 0; padding-left: 20px; }
  .bubble table { width: 100%; border-collapse: collapse; margin: 9px 0; font-size: 14px; }
  .bubble th, .bubble td { padding: 6px 8px; border-bottom: 1px solid var(--sep); text-align: left; }
  .bubble th { color: var(--label2); font-size: 12.5px; font-weight: 600; }
  .bubble td.n, .bubble th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .bubble code { background: var(--fill); border-radius: 5px; padding: 1px 5px; font-size: 14px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .thinking { color: var(--label3); }
  .inline-card { max-width: 100%; align-self: stretch; }

  /* One place to type or speak. */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--dock);
          -webkit-backdrop-filter: saturate(1.8) blur(18px); backdrop-filter: saturate(1.8) blur(18px);
          border-top: 1px solid var(--sep); padding: 8px 16px calc(10px + var(--safe)); }
  .dock .in { max-width: 720px; margin: 0 auto; position: relative; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 0 8px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; font-size: 14px; padding: 7px 13px; border-radius: 999px; color: var(--label);
                  background: var(--group); border: 1px solid var(--sep); cursor: pointer; }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; min-width: 0; font-size: 16px; line-height: 1.4; background: var(--group);
                       border: 1px solid var(--sep); border-radius: 21px; padding: 10px 15px; resize: none;
                       min-height: 44px; max-height: 160px; overflow-y: auto; }
  .round { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; border: 0; cursor: pointer; flex: none; }
  .round svg { width: 21px; height: 21px; }
  .round.mic { background: var(--group); color: var(--label); border: 1px solid var(--sep); }
  .round.mic.on { background: var(--out); color: #fff; border-color: transparent; animation: pulse 1.2s infinite; }
  .round.send { background: var(--qb); color: #fff; }
  .round[disabled] { opacity: .5; cursor: default; }
  .hint { font-size: 12.5px; color: var(--label2); margin: 6px 4px 0; min-height: 0; }
  .needs { position: absolute; left: 50%; transform: translateX(-50%); top: -46px; background: var(--label); color: var(--bg);
           border: 0; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 650; cursor: pointer;
           box-shadow: 0 6px 20px rgba(0,0,0,.18); white-space: nowrap; }

  /* The moment money moves: a real dialog, not the browser's prompt. */
  .veil { position: fixed; inset: 0; background: rgba(20,24,28,.45); display: flex; align-items: center;
          justify-content: center; padding: 20px; z-index: 50; }
  .dlg { background: var(--group); color: var(--label); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
         width: min(520px, 100%); max-height: 90vh; overflow: auto; padding: 20px 20px 16px; }
  .dlg h2 { margin: 0 0 4px; font-size: 18px; }
  .dlg .sub { margin: 0 0 14px; color: var(--label2); font-size: 14px; }
  .dlg .facts { border: 1px solid var(--sep); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .dlg .fact { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; }
  .dlg .fact.amt { border-top: 1px solid var(--sep); margin-top: 6px; padding-top: 8px; font-weight: 700; font-size: 20px; }
  .dlg label { display: block; font-size: 13px; margin: 10px 0 4px; }
  .dlg input, .dlg textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--sep); border-radius: 9px; background: var(--bg); }
  .dlg .hintx { font-size: 12px; color: var(--label3); margin-top: 4px; }
  .dlg .err { color: var(--out); font-size: 13px; margin-top: 8px; }
  .dlg .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* Who you are, when you ask. */
  .sheet { position: fixed; inset: 0; z-index: 55; background: rgba(20,24,28,.4); display: flex; align-items: flex-end; justify-content: center; }
  .sheet .panel { background: var(--bg); width: min(720px, 100%); border-radius: 18px 18px 0 0; padding: 18px 16px calc(22px + var(--safe));
                  max-height: 85vh; overflow: auto; }
  .sheet h2 { font-size: 20px; margin: 0 0 4px; }
  .sheet .rowx:last-child { border-bottom: 0; }
  .areas { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(130px + var(--safe)); transform: translateX(-50%); background: var(--label);
           color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14.5px; font-weight: 600; z-index: 60;
           box-shadow: 0 8px 30px rgba(0,0,0,.2); max-width: calc(100% - 32px); text-align: center; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="mark" aria-hidden="true">qb</div>
    <div class="t"><div class="co" id="co">QuickBooks</div><div class="role" id="role">Checking your access…</div></div>
    <!-- Who you are is a question the page answers, not a screen. -->
    <button class="avatar" id="who" hidden aria-label="Your QuickBooks access">·</button>
  </header>

  <div class="thread" id="earlier"></div>
  <section id="now" aria-live="polite">
    <div class="brief"><div class="skel" style="width:60%;height:24px"></div><div class="skel" style="width:90%"></div><div class="skel" style="width:75%"></div></div>
  </section>
  <div class="thread" id="thread" aria-live="polite"></div>
</div>

<footer class="dock">
  <div class="in">
    <button class="needs" id="needsPill" hidden></button>
    <div class="chips" id="chips"></div>
    <form class="composer" id="composer" autocomplete="off">
      <textarea id="box" rows="1" placeholder="Ask or tell QuickBooks…" aria-label="Ask or tell QuickBooks"></textarea>
      <button type="button" class="round mic" id="mic" hidden aria-label="Speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" class="round send" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="hint" id="hint" hidden></div>
  </div>
</footer>

<script>
'use strict';

// ── session, handed in by the Eesa shell ────────────────────────────────
var TOKEN = null, EESA = null, booted = false, ACCESS = null;
var EESA_FALLBACK = (window.EESA_ORIGIN || 'https://eesa.ai');

window.addEventListener('message', function (ev) {
  var m = ev.data || {};
  if (m.type !== 'eesa:session' || !m.token) return;
  // Prefer an explicit apiBase. ev.origin only holds when a cross-origin Eesa
  // parent framed us; loaded top-level (the mobile WebView) it is OUR OWN
  // origin, and we would POST at this plugin's own server, which has no such
  // route — a 404 that reads as the page being broken.
  EESA = (typeof m.apiBase === 'string' && /^https?:\/\//.test(m.apiBase))
    ? m.apiBase.replace(/\/+$/, '')
    : (ev.origin && ev.origin !== window.location.origin ? ev.origin : EESA_FALLBACK);
  TOKEN = m.token;
  if (m.theme) document.documentElement.setAttribute('data-theme', m.theme);
  if (!booted) { booted = true; boot(); }
});
try { parent.postMessage({ type: 'eesa:plugin-ready' }, '*'); } catch (e) {}

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pause(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/** Intuit's tools. Every one takes { params: {...} }; a bare {} is rejected. */
async function invoke(tool, params) {
  return send({ tool: tool, args: { params: params || {} } });
}

/**
 * Eesa's OWN tools, which are not Intuit's and do not take { params }.
 *
 * Same endpoint and token, a different allowlist on the other side: these
 * dispatch through Eesa's registry as the person in this session, so the role
 * checks that apply in chat apply here. Wrapping these in `params` would send
 * the arguments where nothing reads them, and the tool answers as though called
 * with none — which reads as an empty account rather than a malformed call.
 */
async function platform(tool, args) {
  return send({ tool: tool, args: args || {} });
}

/** Eesa's tools, with a refusal turned into an error that says why. */
async function call(tool, args) {
  var r = await platform(tool, args || {});
  if (!r || r.ok === false) {
    var err = new Error((r && r.error) || 'That did not work. Try again.');
    err.code = r && r.code;
    throw err;
  }
  return r;
}

/**
 * One POST, retried once if the connection drops.
 *
 * Measured 2026-09-10 from this page: six short calls, six successes; three
 * long ones (the agent turn, 12–16s), one failure — a bare TypeError from
 * fetch, no status, nothing logged server-side. Long requests are dropped
 * somewhere between the browser and Django, at a rate a person asking three
 * questions would meet.
 *
 * A dropped connection is not a refusal, and a read is safe to repeat, so it is
 * retried once. Only on a network-level failure: an HTTP status means the
 * server answered and is the answer, and retrying a 403 would just ask a
 * question we have already been told the answer to.
 */
async function send(body) {
  if (!EESA || !TOKEN) throw new Error('Not signed in yet.');
  var url = EESA + '/api/v1/gateway/plugin-ui-invoke/';
  var init = {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
    body: JSON.stringify(body),
  };
  var res = null;
  for (var attempt = 0; attempt < 2; attempt++) {
    try { res = await fetch(url, init); break; }
    catch (e) {
      if (attempt === 1) throw new Error('The connection dropped. Try again.');
    }
  }
  if (!res.ok) {
    var detail = '';
    try { detail = (await res.json()).detail || ''; } catch (e) {}
    // Said the way a bookkeeper would need to hear it, not as a status code.
    if (res.status === 403) {
      throw new Error('Your QuickBooks access does not cover this. Ask whoever '
        + 'looks after QuickBooks to check your role.');
    }
    throw new Error(detail || 'QuickBooks did not answer. Try again in a moment.');
  }
  return res.json();
}

/**
 * Get the data out, whatever shape it arrives in.
 *
 * Verified against the live gateway, because guessing cost a whole build:
 *   get_company_info    -> the object itself   { CompanyName: "…", … }
 *   get_profit_and_loss -> { text: "Profit and Loss Report: {…}" }
 *   get_aged_receivables-> { text: "…" }
 * The gateway unwraps MCP's { content: [{ text }] } envelope for some calls and
 * not others, and a report's text carries a human prefix before its JSON. An
 * earlier version of this handled only the envelope and so rendered every panel
 * empty against a perfectly good 200.
 */
function payload(out) {
  if (!out || typeof out !== 'object') return null;
  var text = null;
  var c = out.content || (out.data && out.data.content);
  if (Array.isArray(c)) {
    for (var i = 0; i < c.length; i++) {
      if (c[i] && typeof c[i].text === 'string') { text = c[i].text; break; }
    }
  }
  if (text === null && typeof out.text === 'string') text = out.text;
  if (text === null) {
    return (out.data && typeof out.data === 'object') ? out.data : out;
  }
  // A report's text reads "Profit and Loss Report: {…}", so start at the JSON.
  var brace = text.indexOf('{');
  if (brace === -1) return null;
  try { return JSON.parse(text.slice(brace)); } catch (e) { return null; }
}

// The books are in US dollars wherever the reader is: "$1,240", never the
// "US$1,240" a browser set to another country would write.
function money(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
}
function cash(n) {
  return Number(n || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function count(n, one, many) {
  var words = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
  return (n < 10 ? words[n] : String(n)) + ' ' + (n === 1 ? one : (many || one + 's'));
}

function findTotal(node, wanted) {
  var hit = null;
  (function walk(n) {
    if (hit !== null || !n || typeof n !== 'object') return;
    if (Array.isArray(n)) { n.forEach(walk); return; }
    var label = n.group || n.ColData && n.ColData[0] && n.ColData[0].value;
    if (typeof label === 'string' && label.toLowerCase() === wanted) {
      var cols = (n.Summary && n.Summary.ColData) || n.ColData;
      if (cols && cols.length > 1) {
        var v = Number(String(cols[cols.length - 1].value || '').replace(/[^0-9.-]/g, ''));
        if (isFinite(v)) { hit = v; return; }
      }
    }
    Object.keys(n).forEach(function (k) { walk(n[k]); });
  })(node);
  return hit;
}

/**
 * Add up the named report sections. Names are QuickBooks' own `group` keys
 * ("Income", "COGS", "OtherExpenses", …), which are stable across companies —
 * unlike the row labels, which a company can rename.
 *
 * Returns null when none of them are present, so a missing section reads as
 * "we don't know" rather than as a confident zero.
 */
function sumGroups(report, groups) {
  var total = null;
  groups.forEach(function (g) {
    var v = findTotal(report, g);
    if (v !== null) total = (total === null ? 0 : total) + v;
  });
  return total;
}

/**
 * Last month, as the person reading the screen would write it.
 *
 * NOT toISOString(), which converts to UTC first. `new Date(y, m, 1)` is local
 * midnight, so anywhere east of Greenwich it lands on the previous day in UTC
 * and every period silently shifted a day early: at GMT+0530 on 9 September
 * 2026 "Last month" asked QuickBooks for 2026-07-31 to 2026-08-30 — wrong at
 * both ends of a month boundary. It reported US$44,840 of income for August
 * against the real US$56,834.87, with nothing on screen to suggest the window
 * was not the one named.
 */
function lastMonth() {
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  var from = new Date(y, m - 1, 1);
  return { from: iso(from), to: iso(new Date(y, m, 0)), name: from.toLocaleDateString(undefined, { month: 'long' }) };
}

/** An ageing report's open balances, largest first. */
function agingRows(report) {
  var rows = [];
  (function walk(n) {
    if (!n || typeof n !== 'object') return;
    if (Array.isArray(n)) { n.forEach(walk); return; }
    var cd = n.ColData;
    if (Array.isArray(cd) && cd.length > 1) {
      var who = (cd[0] && cd[0].value) || '';
      var amt = Number(String((cd[cd.length - 1] || {}).value || '').replace(/[^0-9.-]/g, ''));
      if (who && isFinite(amt) && amt !== 0 && !/^total\b/i.test(who)) rows.push([who, amt]);
    }
    Object.keys(n).forEach(function (k) { walk(n[k]); });
  })(report);
  rows.sort(function (a, b) { return b[1] - a[1]; });
  return rows;
}

// ── the smallest markdown that renders an accounts answer ───────────────
// The agent replies in GitHub markdown, and its tables ARE the answer — shown
// as raw pipes they are unreadable, and an accountant will not trust what they
// cannot scan. Escaped first, so nothing in a reply can inject.
function md(src) {
  var lines = esc(String(src || '')).split(/\r?\n/);
  var out = [], i = 0;
  function inline(t) {
    return t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  }
  var isRow = function (l) { return /^\s*\|.*\|\s*$/.test(l); };
  var cells = function (l) { return l.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); };
  while (i < lines.length) {
    var l = lines[i];
    if (isRow(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      var head = cells(l), body = [];
      i += 2;
      while (i < lines.length && isRow(lines[i])) { body.push(cells(lines[i])); i++; }
      var num = function (v) { return /^[^A-Za-z]*[\d.,]+[^A-Za-z]*$/.test(v) ? ' class="n"' : ''; };
      out.push('<div class="scroll"><table><thead><tr>'
        + head.map(function (h, x) { return '<th' + num(body.length ? (body[0][x] || '') : '') + '>' + inline(h) + '</th>'; }).join('')
        + '</tr></thead><tbody>'
        + body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td' + num(c) + '>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('')
        + '</tbody></table></div>');
      continue;
    }
    var h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push('<h3>' + inline(h[2]) + '</h3>'); i++; continue; }
    if (/^\s*[-*]\s+/.test(l)) {
      var items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push('<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++;
      }
      out.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    if (/^\s*(---+|===+)\s*$/.test(l)) { i++; continue; }
    if (l.trim() === '') { i++; continue; }
    var para = [];
    while (i < lines.length && lines[i].trim() !== '' && !isRow(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^#{1,4}\s/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    out.push('<p>' + inline(para.join(' ')) + '</p>');
  }
  return out.join('');
}

function when(iso) {
  try { var d = new Date(iso); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
    + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; }
}
function toast(text) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200);
}

// ── what this person may see ────────────────────────────────────────────
// The gate is the authority; this only decides what to ASK for. The keys are
// Intuit's own areas, and so is the split of reports into financial / A/R /
// A/P: a Bookkeeper has "A/R and A/P reports" and NOT "profit and loss", so the
// brief tells them who owes what and says nothing of profit.
function may(area) { return !!(ACCESS && ACCESS.areas && ACCESS.areas.indexOf(area) !== -1); }
var AREA_WORDS = {
  sales: 'Sales', expenses: 'Expenses', inventory: 'Inventory', customers: 'Customers',
  vendors: 'Vendors', bank_deposits: 'Bank deposits', transfers: 'Transfers', accounting: 'Accounting',
  payroll: 'Payroll', employees: 'Employees', reports_financial: 'Financial reports', reports_ar: 'A/R reports',
  reports_ap: 'A/P reports', account_management: 'Company info', financial_planning: 'Budgets', taxes: 'Sales tax',
  time: 'Time tracking', settings_lists: 'All lists',
};

// ── what the page knows ─────────────────────────────────────────────────
var ST = {
  brief: null,          // { hello, lines: [html], errors: [text] }
  changes: null,        // quickbooks_changes
  apps: null,           // qb_apps overview
  requests: {},         // app -> qb_requests listing
  people: {},           // app -> qb_people
  review: {},           // app -> items brought in (open)
  setup: null,          // qb_pay_setup — only for payroll roles
  activity: null,       // agent_activity
  errors: {},           // what could not be read, said on the page
  open: {},             // which cards are showing their detail
  inline: {},           // request / change ids already shown under an answer
};

// ── the brief: where things stand, in words ─────────────────────────────
async function loadBrief() {
  var first = ((ACCESS && ACCESS.name) || '').trim().split(/\s+/)[0] || '';
  var hr = new Date().getHours();
  var hello = (hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening') + (first ? ', ' + first : '') + '.';
  var lines = [], errors = [];
  var jobs = [];
  var lm = lastMonth();
  if (may('reports_financial')) {
    jobs.push(invoke('get_profit_and_loss', { start_date: lm.from, end_date: lm.to }).then(function (out) {
      var pl = payload(out);
      // Every section that is money in, and every section that is money out:
      // a P&L splits what goes out three ways, and counting all three is what
      // makes income − expenses equal QuickBooks' own net income to the cent.
      var income = sumGroups(pl, ['income', 'otherincome']);
      var spent = sumGroups(pl, ['cogs', 'expenses', 'otherexpenses']);
      var net = findTotal(pl, 'netincome');
      if (net === null) net = findTotal(pl, 'net income');
      if (net === null && income !== null && spent !== null) net = income - spent;
      if (income === null && spent === null) { lines[0] = 'Nothing was booked in ' + esc(lm.name) + '.'; return; }
      lines[0] = 'In ' + esc(lm.name) + ' you took in <b class="in">' + money(income) + '</b> and spent <b>'
        + money(spent) + '</b> — <b class="' + (Number(net) < 0 ? 'out' : 'in') + '">' + money(Math.abs(net)) + '</b> '
        + (Number(net) < 0 ? 'lost' : 'profit') + '.';
    }).catch(function (e) { errors.push('I could not read last month’s profit and loss: ' + e.message); }));
  }
  if (may('reports_ar')) {
    jobs.push(invoke('get_aged_receivables', {}).then(function (out) {
      var rows = agingRows(payload(out));
      var total = rows.reduce(function (s, r) { return s + r[1]; }, 0);
      lines[1] = total ? 'Customers owe you <b>' + money(total) + '</b>' + (rows[0] ? ' — the most is ' + esc(rows[0][0]) + ', ' + money(rows[0][1]) : '') + '.'
                       : 'No customer owes you anything.';
    }).catch(function (e) { errors.push('I could not read who owes you: ' + e.message); }));
  }
  if (may('reports_ap')) {
    jobs.push(invoke('get_aged_payables', {}).then(function (out) {
      var rows = agingRows(payload(out));
      var total = rows.reduce(function (s, r) { return s + r[1]; }, 0);
      lines[2] = total ? 'You owe suppliers <b>' + money(total) + '</b>' + (rows[0] ? ' — the most to ' + esc(rows[0][0]) + ', ' + money(rows[0][1]) : '') + '.'
                       : 'You owe no supplier anything.';
    }).catch(function (e) { errors.push('I could not read what you owe: ' + e.message); }));
  }
  jobs.push(invoke('get_company_info', {}).then(function (out) {
    var info = payload(out);
    if (info && info.CompanyName) $('#co').textContent = info.CompanyName;
  }).catch(function () { /* the name is nice to have, not worth a line */ }));
  ST.brief = { hello: hello, lines: [], errors: [], loading: true };
  paintNow();
  await Promise.all(jobs);
  ST.brief = { hello: hello, lines: lines.filter(Boolean), errors: errors, loading: false };
  paintNow();
}

// ── what needs you ──────────────────────────────────────────────────────
// Everything here is read, not generated: the agents made the drafts, the
// tasks brought the hours in, and this only lays each out as one decision.
async function loadNeeds() {
  await Promise.all([
    platform('quickbooks_changes', { limit: 25 }).then(function (r) { ST.changes = r; delete ST.errors.changes; })
      .catch(function (e) { ST.errors.changes = e.message; }),
    ACCESS && ACCESS.has_access ? call('qb_apps', {}).then(function (r) { ST.apps = r; delete ST.errors.apps; })
      .catch(function (e) { ST.errors.apps = e.message; }) : null,
    platform('agent_activity', { plugin: 'quickbooks', limit: 6 }).then(function (r) { ST.activity = r.ok ? r.actions || [] : []; })
      .catch(function () { ST.activity = []; }),
  ]);
  paintNow();
  var v = viewer(), conn = connected();
  await Promise.all(conn.map(function (a) {
    return Promise.all([
      loadRequests(a.key),
      a.counts && (a.counts.ready_for_me || a.counts.failed) ? loadReview(a.key) : null,
      v.sees_staff ? call('qb_people', { app: a.key }).then(function (r) { ST.people[a.key] = r; }).catch(function () { delete ST.people[a.key]; }) : null,
    ]);
  }).concat(conn.length && v.sees_pay ? [call('qb_pay_setup', {}).then(function (r) { ST.setup = r; }).catch(function () { ST.setup = null; })] : []));
  paintNow();
  watch();
}
function viewer() { return (ST.apps && ST.apps.viewer) || {}; }
function connected() { return ((ST.apps && ST.apps.apps) || []).filter(function (a) { return a.connected; }); }
async function loadRequests(app) {
  try { ST.requests[app] = await call('qb_requests', { app: app }); }
  catch (e) { ST.requests[app] = { failed: e.message, open: [], recent: [] }; }
}
async function loadReview(app) {
  try { ST.review[app] = await call('qb_review', { app: app, status: 'open' }); }
  catch (e) { ST.review[app] = { failed: e.message, items: [] }; }
}

/** The cards, in the order a person would want to deal with them. */
function needCards() {
  var out = [];   // { key, html, decide }
  var me = (ACCESS && ACCESS.email) || '';
  var ch = ST.changes || {};
  // A card already showing under the answer that made it is not drawn twice,
  // but it still needs the person, so it still counts.
  (ch.waiting_on_me || []).forEach(function (c) {
    out.push({ key: 'c:' + c.id, html: changeCard(c, false), decide: !!c.can_decide, inline: !!ST.inline['c:' + c.id] });
  });
  (ch.failed || []).forEach(function (c) {
    if (c.can_retry) out.push({ key: 'c:' + c.id, html: changeCard(c, false), decide: true, inline: !!ST.inline['c:' + c.id] });
  });
  connected().forEach(function (a) {
    var r = ST.requests[a.key];
    if (r && r.failed) out.push({ key: 'rq:' + a.key, html: '<div class="card"><div class="kicker">' + esc(a.name) + '</div><p class="say bad">' + esc(r.failed) + '</p></div>' });
    ((r && r.open) || []).forEach(function (q) {
      out.push({ key: 'r:' + q.id, html: requestCard(q, a.key), decide: q.status === 'READY' || q.status === 'NEEDS_INFO', inline: !!ST.inline['r:' + q.id] });
    });
    var c = a.counts || {};
    if (c.ready_for_me) out.push({ key: 'post:' + a.key, html: postCard(a), decide: true });
    if (c.failed) out.push({ key: 'fail:' + a.key, html: failedCard(a), decide: true });
    var p = ST.people[a.key];
    if (p && viewer().matches) {
      var loose = (p.people || []).filter(function (x) { return x.on_roster !== false && (!x.match || x.match.status === 'SUGGESTED'); });
      var asked = ((r && r.open) || []).length;
      if (loose.length && !asked) out.push({ key: 'people:' + a.key, html: peopleCard(a, loose), decide: true });
    }
    draftCards(a).forEach(function (d) { out.push(d); });
  });
  ((ST.apps && ST.apps.apps) || []).forEach(function (a) {
    if (!a.connected && viewer().can_connect) out.push({ key: 'connect:' + a.key, html: connectCard(a), decide: false });
  });
  void me;
  return out;
}

// ── painting the part that changes ──────────────────────────────────────
function paintNow() {
  var b = ST.brief || { loading: true, lines: [], errors: [] };
  var all = needCards();
  var decide = all.filter(function (c) { return c.decide; }).length;
  var cards = all.filter(function (c) { return !c.inline; });
  var html = '<div class="brief"><h1 class="hello">' + esc(b.hello || '') + '</h1>';
  if (b.loading) html += '<div class="skel" style="width:88%"></div><div class="skel" style="width:70%"></div>';
  else {
    html += b.lines.map(function (l) { return '<p>' + l + '</p>'; }).join('');
    html += b.errors.map(function (e) { return '<p class="quiet">' + esc(e) + '</p>'; }).join('');
    if (!b.lines.length && !b.errors.length && ACCESS && !ACCESS.has_access) {
      html += '<p>' + esc(ACCESS.note || 'No QuickBooks role has been recorded for you yet, so nothing from QuickBooks will open. Whoever looks after QuickBooks can add it.') + '</p>';
    }
  }
  var loadingNeeds = !ST.changes && !ST.errors.changes;
  html += loadingNeeds ? '<p class="quiet">Checking what needs you…</p>'
    : decide ? '<p><button class="btn link" style="padding:0;font-size:17px" data-act="to-needs">' + count(decide, 'thing needs', 'things need') + ' you.</button></p>'
    : '<p class="quiet">Nothing needs you right now.</p>';
  html += '</div>';
  if (cards.length) {
    html += '<div class="label">Needs you' + (decide ? ' <span class="n">' + decide + '</span>' : '') + '</div>'
      + cards.map(function (c) { return '<div data-key="' + esc(c.key) + '">' + c.html + '</div>'; }).join('');
  }
  if (ST.errors.changes) html += '<div class="card"><p class="say bad">I could not read what is waiting for approval: ' + esc(ST.errors.changes) + '</p></div>';
  if (ST.errors.apps) html += '<div class="card"><p class="say bad">I could not read the connected apps: ' + esc(ST.errors.apps) + '</p></div>';
  html += laterBlock();
  $('#now').innerHTML = html;
  NEEDS = decide;
  FIRST = (all.filter(function (c) { return c.decide; })[0] || {}).key || null;
  pillVisibility();
}

/** Waiting on somebody else, and what was done — quiet, below the decisions. */
function laterBlock() {
  var html = '';
  var mine = ((ST.changes && ST.changes.my_requests) || []).filter(function (c) { return c.status === 'PENDING' && !ST.inline['c:' + c.id]; });
  if (mine.length) {
    html += '<details class="more"' + (ST.open.mine ? ' open' : '') + ' data-keep="mine"><summary>Waiting on somebody else (' + mine.length + ') ›</summary>'
      + mine.map(function (c) { return changeCard(c, true); }).join('') + '</details>';
  }
  var done = (ST.activity || []).slice(0, 5);
  if (done.length) {
    html += '<div class="label">Done lately</div><div class="card" style="padding:4px 16px">'
      + done.map(function (a) {
          return '<div class="rowx"><div class="main">' + esc(a.description) + '<small>' + esc(when(a.at)) + '</small></div>'
            + '<span class="pill ' + ({ ok: 'yes', refused: 'no', error: 'no' }[a.outcome] || '') + '">'
            + esc({ ok: 'Done', refused: 'Refused', error: 'Failed', nothing: 'Nothing there' }[a.outcome] || a.outcome) + '</span></div>';
        }).join('') + '</div>';
  }
  return html;
}

// ── the cards ───────────────────────────────────────────────────────────
var RAIL = { PENDING: 'var(--warn)', APPROVED: 'var(--qb)', EXECUTING: 'var(--qb)', EXECUTED: 'var(--in)', VERIFIED: 'var(--in)',
             FAILED: 'var(--out)', REJECTED: 'var(--out)', CANCELLED: 'var(--label3)', DRAFT: 'var(--label3)' };
function pillClass(st) {
  return st === 'PENDING' ? 'wait' : (st === 'VERIFIED' || st === 'EXECUTED' || st === 'APPROVED') ? 'yes'
       : (st === 'FAILED' || st === 'REJECTED') ? 'no' : '';
}
/**
 * A change to QuickBooks. A person reading it must be able to answer, without
 * opening anything, whether this is a real financial action, whether it has
 * happened yet, exactly what will happen and to whom, and who or what is
 * stopping it. So the amount is the largest thing on it, the status is a
 * stripe down the left, and a button that cannot be pressed says why rather
 * than disappearing.
 */
function changeCard(c, mine) {
  var rail = RAIL[c.status] || 'var(--label3)';
  var who = c.counterparty_name ? '<div class="meta">' + (c.counterparty_kind === 'vendor' ? 'Vendor' : 'Customer') + ': ' + esc(c.counterparty_name) + '</div>' : '';
  var by = '<div class="meta">Asked for by ' + esc(c.requested_by_name || c.requested_by) + (mine ? ' (you)' : '')
    + (c.created_at ? ' · ' + esc(when(c.created_at)) : '') + '</div>';
  var lines = '';
  var p = (c.payload && c.payload.params) || {};
  var L = p.Line || p.line_items || [];
  if (Array.isArray(L) && L.length) {
    // A line's money is Amount where Intuit gives one, and qty × unit_price
    // where it gives those instead — the same rule the validator applies, so
    // the card never shows a $0 line under a $12 total.
    var lineAmt = function (l) {
      if (l.Amount != null || l.amount != null) return Number(l.Amount != null ? l.Amount : l.amount);
      var q = l.qty != null ? l.qty : (l.Qty != null ? l.Qty : l.quantity);
      var u = l.unit_price != null ? l.unit_price : l.UnitPrice;
      return (q != null && u != null) ? Number(q) * Number(u) : 0;
    };
    lines = '<div class="lines">' + L.slice(0, 8).map(function (l) {
      var q = l.qty != null ? l.qty : (l.Qty != null ? l.Qty : l.quantity);
      return '<div class="line"><span>' + esc(l.Description || l.description || 'Line') + (q != null && Number(q) !== 1 ? ' × ' + esc(String(q)) : '')
        + '</span><span class="num">' + money(lineAmt(l)) + '</span></div>';
    }).join('') + '</div>';
  }
  // An edit shows what is there now and what will be there after; a deletion
  // says plainly what disappears. Neither is a creation and must not read like one.
  var op = c.operation || 'create';
  var opWord = op === 'update' ? 'Edit' : (op === 'delete' || op === 'void') ? 'Delete' : '';
  var beforeBits = [];
  if (c.before && typeof c.before === 'object') {
    if (c.before.DocNumber) beforeBits.push('No. ' + esc(c.before.DocNumber));
    if (c.before.TxnDate) beforeBits.push('dated ' + esc(c.before.TxnDate));
    if (c.before.TotalAmt != null) beforeBits.push('total ' + money(c.before.TotalAmt));
    if (c.before.Balance != null && Number(c.before.Balance) !== Number(c.before.TotalAmt)) beforeBits.push('balance ' + money(c.before.Balance));
  }
  var opBlock = '';
  if (op === 'update' && Array.isArray(c.changes) && c.changes.length) {
    opBlock = '<div class="lines"><div class="line" style="font-weight:600"><span>What changes</span><span>before → after</span></div>'
      + c.changes.map(function (x) {
          return '<div class="line"><span>' + esc(x.field) + '</span><span>' + esc(x.before === '' ? '—' : x.before) + ' → <b>' + esc(x.after === '' ? '—' : x.after) + '</b></span></div>';
        }).join('') + '</div>' + (beforeBits.length ? '<div class="meta">As it is now: ' + beforeBits.join(' · ') + '</div>' : '');
  } else if (op === 'delete' || op === 'void') {
    opBlock = '<div class="strip bad"><b>This will ' + (c.kind === 'invoice' ? 'void' : 'delete') + ' the ' + esc(c.kind || 'record')
      + (beforeBits.length ? ' — ' + beforeBits.join(' · ') : '') + '</b><div>Cannot be undone from Eesa. Approving needs the amount typed back.</div></div>';
  }
  var val = '';
  if (c.validation && c.validation.errors && c.validation.errors.length) {
    val = '<div class="strip bad"><b>This cannot be approved yet</b>' + c.validation.errors.map(function (e) { return '<div>• ' + esc(e) + '</div>'; }).join('') + '</div>';
  } else if (c.validation && c.validation.warnings && c.validation.warnings.length) {
    val = '<div class="strip warn"><b>Check before approving</b>' + c.validation.warnings.map(function (e) { return '<div>• ' + esc(e) + '</div>'; }).join('') + '</div>';
  }
  var req = '';
  if (c.status === 'PENDING') {
    req = '<div class="meta">' + c.approvals_received + ' of ' + c.required_approvals + ' approval' + (c.required_approvals === 1 ? '' : 's') + ' received'
      + (c.high_risk ? ' · high risk: the amount must be typed back' : '')
      + ((c.matched_policies || []).length ? ' · policy: ' + esc(c.matched_policies.map(function (m) { return m.name; }).join(', ')) : '')
      + (c.expires_at ? ' · expires ' + esc(when(c.expires_at)) : '') + '</div>';
  }
  var outcome = '';
  if (c.status === 'VERIFIED' || c.status === 'EXECUTED') {
    var done = op === 'update' ? ' changed in QuickBooks' : (op === 'delete' || op === 'void') ? (c.kind === 'invoice' ? ' voided in QuickBooks' : ' deleted from QuickBooks') : ' created in QuickBooks';
    outcome = '<div class="strip ok"><b>' + esc(c.kind || 'Change') + done + '</b>'
      + (c.quickbooks_id ? '<div>QuickBooks ID ' + esc(c.quickbooks_id) + (c.quickbooks_doc_number ? ' · No. ' + esc(c.quickbooks_doc_number) : '') + '</div>' : '')
      + '<div>' + (c.status === 'VERIFIED' ? 'Read back from QuickBooks and confirmed to match what was approved.' : 'Sent. Checking that QuickBooks holds what was approved…') + '</div></div>';
  } else if (c.status === 'FAILED') {
    outcome = '<div class="strip bad"><b>QuickBooks refused it</b><div>' + esc(c.status_reason || '') + '</div><div>Nothing was created.</div></div>';
  } else if (c.status === 'REJECTED') {
    var r = (c.decisions || []).filter(function (d) { return d.status === 'REJECTED'; })[0];
    outcome = '<div class="strip bad"><b>Turned down</b><div>' + esc((r && r.reason) || c.status_reason || '') + '</div>' + (r ? '<div>by ' + esc(r.by) + '</div>' : '') + '</div>';
  }
  var actions = '';
  if (c.status === 'FAILED' && c.can_retry) {
    var unknown = c.last_execution && c.last_execution.status === 'INDETERMINATE';
    actions = '<div class="actions"><span class="meta">' + (unknown
        ? 'The last attempt’s outcome was unknown. Eesa will look in QuickBooks for the document before sending again.'
        : 'Attempt ' + esc(String((c.last_execution && c.last_execution.attempt) || 1)) + ' failed. The approvals still stand; the same change is sent again.') + '</span>'
      + '<button class="btn primary" data-act="retry" data-id="' + esc(c.id) + '">Try again</button></div>';
  } else if (c.status === 'PENDING' && !mine) {
    var blocked = (c.blockers || []).length ? c.blockers[0] : '';
    actions = '<div class="actions">' + (blocked ? '<span class="meta">' + esc(blocked) + '</span>' : '')
      + '<button class="btn" data-act="reject" data-id="' + esc(c.id) + '"' + (blocked ? ' disabled' : '') + '>Turn down</button>'
      + '<button class="btn primary" data-act="approve" data-id="' + esc(c.id) + '"' + (blocked ? ' disabled' : '') + '>Approve</button></div>';
  } else if (c.status === 'PENDING' && mine) {
    actions = '<div class="actions"><button class="btn" data-act="cancel" data-id="' + esc(c.id) + '">Cancel request</button></div>';
  }
  return '<div class="change" data-change="' + esc(c.id) + '" style="border-left:5px solid ' + rail + '">'
    + '<div class="chead"><div><span class="pill ' + pillClass(c.status) + '">' + esc(c.status_label || c.status) + '</span>'
    + (opWord ? ' <span class="pill">' + opWord + '</span>' : '') + ' <b>' + esc(c.summary) + '</b>' + who + by + '</div>'
    + '<div class="amt">' + money(c.amount) + '</div></div>'
    + (op === 'create' ? lines : '') + opBlock + val + req + outcome + actions + '</div>';
}

/**
 * A request to the attendance assistant: what was said, the draft, what the
 * rules and the checker found — each with who found it — and one decision.
 */
function requestCard(q, app) {
  var icon = { ok: '✓', warn: '!', stop: '✕' };
  var verdict = { ok: ['ok', 'Checked — looks right'], attention: ['warn', 'Checked — look at these first'],
                  stop: ['bad', 'Checked — this can’t be approved as it is'] }[q.verdict || (q.blocked ? 'stop' : 'attention')];
  var steps = q.steps.length ? '<ol class="steps">' + q.steps.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>' : '';
  var body = '';
  if (q.status === 'DRAFTING') body = '<p class="say working">The attendance assistant is drafting it</p>';
  else if (q.status === 'CHECKING') body = steps + '<p class="say working">A checker is looking it over</p>';
  else if (q.status === 'NEEDS_INFO') body = '<p class="ask">' + esc(q.question) + '</p>'
    + '<div class="answer"><input data-answer="' + esc(q.id) + '" placeholder="Your answer" aria-label="Your answer">'
    + '<button class="btn primary" data-act="answer" data-id="' + esc(q.id) + '" data-app="' + esc(app) + '">Answer</button></div>'
    + '<div class="actions"><button class="btn link" data-act="discard-req" data-id="' + esc(q.id) + '" data-app="' + esc(app) + '">Never mind</button></div>';
  else if (q.status === 'READY') body = steps
    + '<div class="found ' + verdict[0] + '"><b>' + verdict[1] + '</b>'
    + q.findings.map(function (f) { return '<div class="f ' + esc(f.level) + '"><span>' + (icon[f.level] || '·') + '</span><span>' + esc(f.text) + ' <em>' + (f.by === 'rules' ? 'rules' : 'checker') + '</em></span></div>'; }).join('')
    + '</div><div class="actions"><span class="meta">Each step runs as you, inside your QuickBooks role.</span>'
    + '<button class="btn" data-act="discard-req" data-id="' + esc(q.id) + '" data-app="' + esc(app) + '">Discard</button>'
    + '<button class="btn primary" data-act="approve-req" data-id="' + esc(q.id) + '" data-app="' + esc(app) + '"' + (q.blocked ? ' disabled' : '') + '>Approve</button></div>';
  else if (q.status === 'APPLYING') body = steps + '<p class="say working">Applying</p>';
  else if (q.status === 'DONE' || q.status === 'FAILED') body = '<ol class="steps">' + (q.results.length ? q.results : q.steps.map(function (t) { return { ok: false, text: t }; }))
    .map(function (x) { return '<li class="' + (x.ok ? 'ok' : 'bad') + '">' + (x.ok ? '✓ ' : '✕ ') + esc(x.text) + '</li>'; }).join('') + '</ol>'
    + (q.error ? '<p class="say bad">' + esc(q.error) + '</p>' : '');
  else if (q.status === 'DISCARDED') body = '<p class="say">Discarded.</p>';
  var kicker = { DRAFTING: 'Drafting', CHECKING: 'Checking', READY: 'Ready for you', NEEDS_INFO: 'A question for you', APPLYING: 'Applying',
                 DONE: 'Done', FAILED: 'Did not go through', DISCARDED: 'Discarded' }[q.status] || q.status_label;
  return '<div class="card" data-req="' + esc(q.id) + '"><div class="kicker">Attendance · ' + esc(kicker) + '</div>'
    + '<h3>“' + esc(q.words) + '”</h3>' + body + '</div>';
}
