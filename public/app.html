// ── keeping it live ─────────────────────────────────────────────────────
// A draft takes the assistant and the checker 20–60 seconds; the card says
// what is happening and changes on its own when it is ready.
var watchTimer = null;
function busy() {
  return connected().some(function (a) {
    return (((ST.requests[a.key] || {}).open) || []).some(function (q) { return ['DRAFTING', 'CHECKING', 'APPLYING'].indexOf(q.status) !== -1; });
  });
}
function watch() {
  clearTimeout(watchTimer);
  if (!busy()) return;
  watchTimer = setTimeout(async function () {
    await Promise.all(connected().map(function (a) { return loadRequests(a.key); }));
    paintNow(); paintInline(); watch();
  }, 2500);
}
/** A card shown under an answer is the same card: redraw it where it sits. */
function paintInline() {
  document.querySelectorAll('#thread [data-inline-req]').forEach(function (el) {
    var id = el.getAttribute('data-inline-req'), app = el.getAttribute('data-app');
    var all = ((ST.requests[app] || {}).open || []).concat((ST.requests[app] || {}).recent || []);
    var q = all.filter(function (x) { return x.id === id; })[0];
    if (q) el.innerHTML = requestCard(q, app);
  });
}

// ── what was asked, and what was answered ───────────────────────────────
var asking = false;
function turn(where, html, cls) {
  var d = document.createElement('div');
  d.className = 'turn' + (cls ? ' ' + cls : '');
  d.innerHTML = '<div class="bubble">' + html + '</div>';
  $(where).appendChild(d);
  return d;
}
function settle(bubble, t) {
  if (t.status === 'DONE') bubble.innerHTML = md(t.answer);
  // Never a silent failure: the question stays on screen with the reason.
  else if (t.status === 'FAILED') bubble.innerHTML = '<p class="bad" style="color:var(--out)">' + esc(t.error || 'No answer came back.') + '</p>';
}
/**
 * Ask, then poll. Never wait on the answer over one connection: the edge gives
 * up on any response slower than 30 seconds and answers with a 500 of its own,
 * and an agent turn takes 12–60s. The question is stored, a worker answers it,
 * and this polls the row every two seconds — three minutes at most, then it
 * says so rather than spinning.
 */
async function ask(question) {
  question = String(question || '').trim();
  if (asking || !question) return;
  asking = true; stopListening();
  $('#send').disabled = true;
  $('#box').value = ''; autosize();
  turn('#thread', '<p>' + esc(question) + '</p>', 'me');
  var pending = turn('#thread', '<p class="thinking working">Working on it</p>');
  pending.scrollIntoView({ block: 'end', behavior: 'smooth' });
  var bubble = pending.querySelector('.bubble');
  var since = Date.now(), known = knownIds();
  try {
    // `specialist` is not sent: Eesa pins it to this plugin, so a page scoped
    // to the books cannot ask another plugin's agent.
    var sent = await platform('specialist_chat_send', { question: question });
    if (!sent.ok) throw new Error(sent.error || 'Could not send that.');
    var id = sent.turn.id, t = sent.turn;
    since = Date.parse(sent.turn.created_at || '') || since;
    for (var i = 0; i < 90 && t.status !== 'DONE' && t.status !== 'FAILED'; i++) {
      await pause(2000);
      if (i === 15) bubble.innerHTML = '<p class="thinking working">Still working — a long report takes a while</p>';
      var st = await platform('specialist_chat_status', { turn_id: id });
      if (st.ok) t = st.turn;
    }
    if (t.status !== 'DONE' && t.status !== 'FAILED') {
      t = { status: 'FAILED', error: 'This is taking longer than three minutes. It is still being worked on — it will be here when you come back.' };
    }
    settle(bubble, t);
    if (t.status === 'DONE') await showWhatItMade(since, known);
  } catch (e) {
    bubble.innerHTML = '<p style="color:var(--out)">' + esc(e.message) + '</p>';
  } finally {
    asking = false;
    $('#send').disabled = false;
    pending.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}
/**
 * An answer that made something — a change for approval, a draft for the
 * assistant — shows it right under the answer, live, so the person sees what
 * was recorded, that it is waiting, and for whom.
 */
function knownIds() {
  var ids = {};
  var q = ST.changes || {};
  (q.waiting_on_me || []).concat(q.my_requests || [], q.failed || []).forEach(function (c) { ids['c:' + c.id] = true; });
  Object.keys(ST.requests).forEach(function (app) {
    ((ST.requests[app] || {}).open || []).concat((ST.requests[app] || {}).recent || []).forEach(function (r) { ids['r:' + r.id] = true; });
  });
  return ids;
}
async function showWhatItMade(since, known) {
  await loadNeeds();
  // New since the question was asked — not merely recent: a draft somebody
  // started a moment before is not what this answer made.
  var freshC = function (c) { return !known['c:' + c.id] && Date.parse(c.created_at || '') >= since - 5000; };
  var freshR = function (q) { return !known['r:' + q.id] && Date.parse(q.created_at || '') >= since - 5000; };
  var me = (ACCESS && ACCESS.email) || '';
  ((ST.changes && ST.changes.my_requests) || []).filter(freshC).forEach(function (c) {
    ST.inline['c:' + c.id] = true;
    var d = document.createElement('div'); d.className = 'turn inline-card'; d.innerHTML = changeCard(c, true);
    $('#thread').appendChild(d);
  });
  connected().forEach(function (a) {
    (((ST.requests[a.key] || {}).open) || []).filter(function (q) { return freshR(q) && (!me || q.asked_by === me); }).forEach(function (q) {
      ST.inline['r:' + q.id] = true;
      var d = document.createElement('div'); d.className = 'turn inline-card';
      d.setAttribute('data-inline-req', q.id); d.setAttribute('data-app', a.key);
      d.innerHTML = requestCard(q, a.key);
      $('#thread').appendChild(d);
    });
  });
  paintNow(); watch();
}
/** Earlier questions, so the page is a record rather than a scratchpad. */
async function loadHistory() {
  try {
    var h = await platform('specialist_chat_history', { limit: 12 });
    var box = $('#earlier');
    box.innerHTML = '';
    (h.turns || []).forEach(function (t) {
      turn('#earlier', '<p>' + esc(t.question) + '</p>', 'me');
      var b = turn('#earlier', '<p class="thinking working">Working on it</p>').querySelector('.bubble');
      settle(b, t);
      // A turn still in flight when the page opened: keep polling it.
      if (t.status === 'QUEUED' || t.status === 'RUNNING') resume(t.id, b);
    });
  } catch (e) { /* history is a convenience; asking still works */ }
}
async function resume(id, bubble) {
  var t = { status: 'RUNNING' };
  for (var i = 0; i < 90 && t.status !== 'DONE' && t.status !== 'FAILED'; i++) {
    await pause(2000);
    var st = await platform('specialist_chat_status', { turn_id: id });
    if (st.ok) t = st.turn;
  }
  settle(bubble, t);
}

// ── the composer: type or speak ─────────────────────────────────────────
function autosize() {
  var b = $('#box'); b.style.height = 'auto'; b.style.height = Math.min(b.scrollHeight, 160) + 'px';
}
$('#box').addEventListener('input', autosize);
$('#box').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask($('#box').value); }
});
$('#composer').addEventListener('submit', function (e) { e.preventDefault(); ask($('#box').value); });

/**
 * Speaking is typing by voice: the words land in the box, where they can be
 * read and fixed before they are sent. The browser does the listening; where it
 * cannot — or Eesa has not been allowed the microphone — the button says so
 * once and goes away, rather than failing every time it is pressed.
 */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
function hint(text) { var h = $('#hint'); h.textContent = text || ''; h.hidden = !text; }
function stopListening() { if (rec) { try { rec.stop(); } catch (e) {} } }
if (SR) {
  $('#mic').hidden = false;
  $('#mic').addEventListener('click', function () {
    if (rec) { stopListening(); return; }
    var base = $('#box').value.trim();
    rec = new SR();
    rec.lang = navigator.language || 'en-US';
    rec.interimResults = true; rec.continuous = true;
    rec.onresult = function (e) {
      var said = '';
      for (var i = 0; i < e.results.length; i++) said += e.results[i][0].transcript;
      $('#box').value = (base ? base + ' ' : '') + said.trim(); autosize();
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') {
        hint('The microphone isn’t available here — allow it for Eesa in your browser, or type instead.');
        $('#mic').hidden = true;
      } else if (e.error !== 'aborted' && e.error !== 'no-speech') hint('Didn’t catch that — try again, or type it.');
    };
    rec.onend = function () { rec = null; $('#mic').classList.remove('on'); $('#mic').setAttribute('aria-label', 'Speak'); };
    try { rec.start(); hint(''); $('#mic').classList.add('on'); $('#mic').setAttribute('aria-label', 'Stop listening'); }
    catch (e) { rec = null; hint('The microphone isn’t available here — type instead.'); }
  });
}

/** Suggestions follow the role, so nobody is invited to ask what they can't. */
function paintChips() {
  var v = viewer(), conn = connected().length;
  var chips = [];
  if (may('reports_financial')) chips.push(['ask', 'How did last month go?']);
  if (may('reports_ar')) chips.push(['ask', 'Who owes us the most?']);
  if (may('reports_ap')) chips.push(['ask', 'What bills are due soon?']);
  if (conn && v.sets_pay) chips.push(['fill', 'Set pay for ']);
  if (conn && v.adds_employees) chips.push(['fill', 'Add to QuickBooks: ']);
  if (may('sales')) chips.push(['fill', 'Draft an invoice for ']);
  $('#chips').innerHTML = chips.map(function (c) {
    return '<button type="button" data-chip="' + c[0] + '">' + esc(c[1].trim().replace(/:$/, '')) + (c[0] === 'fill' ? '…' : '') + '</button>';
  }).join('');
  $('#chips').querySelectorAll('button').forEach(function (b, i) {
    b.addEventListener('click', function () {
      if (chips[i][0] === 'ask') return ask(chips[i][1]);
      $('#box').value = chips[i][1]; autosize(); $('#box').focus();
    });
  });
}

// "N things need you ↑" whenever the first of them is out of sight — wherever
// it is: at the top, or under the answer that made it.
var NEEDS = 0, FIRST = null, pillFrame = false;
function firstDecision() {
  if (!FIRST) return null;
  var id = FIRST.slice(2);
  return document.querySelector('[data-key="' + FIRST + '"]')
    || (FIRST.indexOf('r:') === 0 && document.querySelector('[data-req="' + id + '"]'))
    || (FIRST.indexOf('c:') === 0 && document.querySelector('[data-change="' + id + '"]')) || null;
}
function pillVisibility() {
  var el = NEEDS ? firstDecision() : null, pill = $('#needsPill');
  if (!el) { pill.hidden = true; return; }
  var r = el.getBoundingClientRect(), above = r.bottom < 70, below = r.top > $('.dock').getBoundingClientRect().top;
  pill.textContent = count(NEEDS, 'thing needs', 'things need') + ' you ' + (above ? '↑' : '↓');
  pill.hidden = !(above || below);
}
function toNeeds() { var el = firstDecision(); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
window.addEventListener('scroll', function () {
  if (pillFrame) return;
  pillFrame = true;
  requestAnimationFrame(function () { pillFrame = false; pillVisibility(); });
}, { passive: true });
$('#needsPill').addEventListener('click', toNeeds);

// ── decisions ───────────────────────────────────────────────────────────
function normalizeAmount(t) {
  var v = parseFloat(String(t || '').replace(/[^0-9.\-]/g, ''));
  return isFinite(v) ? v.toFixed(2) : '';
}
function facts(c) {
  var rows = [['Type', (c.operation === 'update' ? 'Edit ' : (c.operation === 'delete' || c.operation === 'void') ? 'Void/delete ' : 'New ') + esc(c.kind || 'change')]];
  if (c.counterparty_name) rows.push([c.counterparty_kind === 'vendor' ? 'Vendor' : 'Customer', esc(c.counterparty_name)]);
  rows.push(['Company', esc($('#co').textContent || 'QuickBooks')]);
  rows.push(['Asked for by', esc(c.requested_by_name || c.requested_by)]);
  if (c.before && c.before.DocNumber) rows.push(['Document', 'No. ' + esc(c.before.DocNumber) + (c.before.TxnDate ? ' · ' + esc(c.before.TxnDate) : '')]);
  return '<div class="facts">' + rows.map(function (r) { return '<div class="fact"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>'; }).join('')
    + '<div class="fact amt"><span>Amount</span><span>' + money(c.amount) + '</span></div></div>';
}
/** A dialog; resolves with the submitted values, or null when cancelled. */
function dialog(o) {
  return new Promise(function (resolve) {
    var veil = document.createElement('div'); veil.className = 'veil';
    veil.innerHTML = '<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">'
      + '<h2 id="dlgT">' + esc(o.title) + '</h2>' + (o.sub ? '<p class="sub">' + o.sub + '</p>' : '')
      + (o.body || '') + '<div class="err" id="dlgErr" hidden></div>'
      + '<div class="foot"><button class="btn" data-x="cancel">Cancel</button>'
      + '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-x="ok" id="dlgOk">' + esc(o.ok) + '</button></div></div>';
    document.body.appendChild(veil);
    var okBtn = veil.querySelector('#dlgOk');
    function close(v) { document.removeEventListener('keydown', onKey); veil.remove(); resolve(v); }
    function onKey(e) { if (e.key === 'Escape') close(null); }
    document.addEventListener('keydown', onKey);
    veil.addEventListener('click', function (e) { if (e.target === veil) close(null); });
    veil.querySelector('[data-x=cancel]').onclick = function () { close(null); };
    var check = function () { var v = o.validate ? o.validate(veil) : null; okBtn.disabled = !!v; return v; };
    veil.addEventListener('input', check); check();
    okBtn.onclick = async function () {
      var vals = o.collect ? o.collect(veil) : {};
      okBtn.disabled = true; okBtn.textContent = 'Working…';
      try { await o.submit(vals); close(vals); }
      catch (err) {
        var el = veil.querySelector('#dlgErr'); el.textContent = err.message; el.hidden = false;
        okBtn.disabled = false; okBtn.textContent = o.ok;
      }
    };
    var first = veil.querySelector('input, textarea'); if (first) first.focus(); else okBtn.focus();
  });
}
async function decide(args) {
  var r = await platform('quickbooks_change_decide', args);
  if (!r.ok) { var e = new Error(r.error || 'That did not go through.'); e.code = r.code; throw e; }
  return r;
}
// Approving is the moment money moves, so the dialog restates the change in
// full, and for a high-risk change it makes them type the amount back — the
// one failure a policy engine cannot catch is clicking through $50,000 read as
// $5,000. Turning down needs a reason: it is all the asker has to work from.
function approveDialog(c) {
  var isFinal = (c.approvals_received + 1) >= c.required_approvals;
  var expected = Number(c.amount).toFixed(2);
  return dialog({
    title: isFinal ? 'Approve and send to QuickBooks' : 'Record your approval',
    sub: isFinal ? 'This is the final approval. Approving sends the change to QuickBooks now.'
                 : 'This change needs ' + c.required_approvals + ' approvals. Yours will be ' + (c.approvals_received + 1) + ' of ' + c.required_approvals + '.',
    ok: isFinal ? 'Approve and send' : 'Approve',
    body: facts(c)
      + ((c.validation && c.validation.warnings && c.validation.warnings.length)
          ? '<div class="strip warn"><b>Check before approving</b>' + c.validation.warnings.map(function (w) { return '<div>• ' + esc(w) + '</div>'; }).join('') + '</div>' : '')
      + (c.high_risk ? '<label for="dlgAmt">Type the amount to confirm: ' + esc(expected) + '</label>'
          + '<input id="dlgAmt" inputmode="decimal" placeholder="' + esc(expected) + '" autocomplete="off">'
          + '<div class="hintx" id="dlgAmtHint">High-risk changes need the amount typed back before they can be approved.</div>' : '')
      + '<label for="dlgNote">Note (optional)</label><textarea id="dlgNote" rows="2" maxlength="500"></textarea>',
    validate: function (v) {
      if (!c.high_risk) return null;
      var t = v.querySelector('#dlgAmt').value, h = v.querySelector('#dlgAmtHint');
      var ok = normalizeAmount(t) === expected;
      h.textContent = (t && !ok) ? 'That does not match the amount.' : 'High-risk changes need the amount typed back before they can be approved.';
      h.style.color = (t && !ok) ? 'var(--out)' : '';
      return ok ? null : 'amount';
    },
    collect: function (v) { return { confirmed_amount: c.high_risk ? v.querySelector('#dlgAmt').value : undefined, note: v.querySelector('#dlgNote').value.trim() || undefined }; },
    submit: function (vals) { return decide({ change_id: c.id, decision: 'approve', confirmed_amount: vals.confirmed_amount, note: vals.note }); },
  });
}
function rejectDialog(c) {
  return dialog({
    title: 'Turn down this change', sub: esc(c.summary) + ' — ' + money(c.amount) + '. Nothing will be sent to QuickBooks.', ok: 'Turn down', danger: true,
    body: '<label for="dlgReason">Why</label><textarea id="dlgReason" rows="3" maxlength="1000" placeholder="e.g. Wrong customer — this should be billed to the parent company."></textarea>'
      + '<div class="hintx">Shared with whoever asked for it, and recorded.</div>',
    validate: function (v) { return v.querySelector('#dlgReason').value.trim().length >= 3 ? null : 'reason'; },
    collect: function (v) { return { reason: v.querySelector('#dlgReason').value.trim() }; },
    submit: function (vals) { return decide({ change_id: c.id, decision: 'reject', reason: vals.reason }); },
  });
}
function cancelDialog(c) {
  return dialog({ title: 'Cancel this request?', sub: 'Nothing has been sent to QuickBooks.', ok: 'Cancel request', danger: true,
                  submit: function () { return decide({ change_id: c.id, decision: 'cancel' }); } });
}
function retryDialog(c) {
  var unknown = c.last_execution && c.last_execution.status === 'INDETERMINATE';
  return dialog({
    title: 'Send to QuickBooks again?',
    sub: unknown ? 'The last attempt’s outcome was unknown. Eesa will first look in QuickBooks for the document, and only send again if it is not there.'
                 : 'The last attempt failed: ' + esc((c.last_execution && c.last_execution.error) || c.status_reason || '') + '. The same approved change is sent again.',
    ok: 'Try again', body: facts(c),
    submit: function () { return decide({ change_id: c.id, decision: 'retry' }); },
  });
}
/** After the final approval the worker sends it; say how it went. */
async function pollChange(id) {
  for (var i = 0; i < 30; i++) {
    await pause(2000);
    var st = await platform('quickbooks_change_status', { change_id: id }).catch(function () { return { ok: false }; });
    if (!st.ok) return;
    var c = st.change, s = c.status;
    redrawChange(c);
    if (s === 'APPROVED' || s === 'EXECUTING' || (s === 'FAILED' && i < 2)) continue;
    if (s === 'VERIFIED' || s === 'EXECUTED') toast(c.summary + ' — in QuickBooks' + (s === 'VERIFIED' ? ', checked' : ''));
    else if (s === 'FAILED') toast('QuickBooks refused ' + c.summary + (c.status_reason ? ': ' + c.status_reason : ''));
    await loadNeeds();
    return;
  }
}
function redrawChange(c) {
  document.querySelectorAll('[data-change="' + c.id + '"]').forEach(function (el) {
    var mine = el.closest('.inline-card') !== null;
    el.outerHTML = changeCard(c, mine);
  });
}
function findChange(id) {
  var q = ST.changes || {};
  return (q.waiting_on_me || []).concat(q.my_requests || [], q.failed || []).filter(function (x) { return x.id === id; })[0];
}
function findRequest(app, id) {
  var r = ST.requests[app] || {};
  return (r.open || []).concat(r.recent || []).filter(function (x) { return x.id === id; })[0];
}

document.addEventListener('toggle', function (e) {
  var d = e.target;
  if (d.matches && d.matches('details[data-keep]')) ST.open[d.getAttribute('data-keep')] = d.open;
}, true);

document.addEventListener('click', async function (e) {
  var b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  var act = b.dataset.act, id = b.dataset.id, app = b.dataset.app;
  try {
    if (act === 'approve' || act === 'reject' || act === 'cancel' || act === 'retry') {
      var c = findChange(id);
      if (!c) return;
      var done = await { approve: approveDialog, reject: rejectDialog, cancel: cancelDialog, retry: retryDialog }[act](c);
      if (!done) return;
      toast({ approve: 'Approved — sending it to QuickBooks', reject: 'Turned down — they have been told why',
              cancel: 'Cancelled — nothing was sent', retry: 'Sending it again' }[act]);
      await loadNeeds();
      if (act === 'approve' || act === 'retry') pollChange(id);
      return;
    }
    if (act === 'approve-req') {
      // The card is the confirmation: it shows every step and what was checked.
      b.disabled = true; b.textContent = 'Applying…';
      var r = await call('qb_requests', { app: app, action: 'approve', id: id });
      toast(r.request.status === 'DONE' ? 'Done — each step is on the card' : 'Stopped — the card says where');
      ST.inline['r:' + id] = ST.inline['r:' + id] || false;
      await loadRequests(app); paintNow(); paintInline();
      setTimeout(loadNeeds, 6000);
      return;
    }
    if (act === 'discard-req') {
      await call('qb_requests', { app: app, action: 'discard', id: id });
      await loadRequests(app); paintNow(); paintInline();
      return;
    }
    if (act === 'answer') {
      var q = findRequest(app, id);
      var input = document.querySelector('[data-answer="' + id + '"]');
      var ans = input ? input.value.trim() : '';
      if (!ans || !q) { if (input) input.focus(); return; }
      b.disabled = true;
      // The answer and the question go back together, as one request — and
      // its card takes the place of the one that asked.
      var again = await call('qb_requests', { app: app, action: 'ask', words: q.words + '\n' + ans });
      await call('qb_requests', { app: app, action: 'discard', id: id }).catch(function () {});
      var spot = document.querySelector('#thread [data-inline-req="' + id + '"]');
      if (spot && again.request) { spot.setAttribute('data-inline-req', again.request.id); ST.inline['r:' + again.request.id] = true; }
      await loadRequests(app); paintNow(); paintInline(); watch();
      return;
    }
    if (act === 'sort-people') {
      b.disabled = true; b.textContent = 'Asking…';
      await call('qb_requests', { app: app, action: 'ask', words:
        'Match everybody who is not matched to QuickBooks yet to their QuickBooks employee, or add them to QuickBooks if they '
        + 'are not there. Where you are not sure who somebody is, ask me.' });
      await loadRequests(app); paintNow(); watch();
      return;
    }
    if (act === 'post') {
      var me = (ACCESS && ACCESS.email) || '';
      var ids = (((ST.review[app] || {}).items) || []).filter(function (i) { return i.status === 'REVIEW' && i.task && i.task.owner === me; }).map(function (i) { return i.id; });
      if (!ids.length) return;
      b.disabled = true; b.textContent = 'Posting…';
      var out = await call('qb_review', { app: app, action: 'post', ids: ids });
      toast(plural(out.posted.length, 'entry', 'entries') + ' sent to QuickBooks' + (out.refused.length ? ' · ' + out.refused.length + ' refused: ' + out.refused[0].error : ''));
      await loadNeeds();
      setTimeout(loadNeeds, 6000);
      return;
    }
    if (act === 'skip-item') {
      var ok = await dialog({ title: 'Don’t post this?', ok: 'Don’t post',
        sub: 'It stays out of QuickBooks, and no task brings it back.',
        body: '<label for="skipWhy">Why, so the team knows</label><textarea id="skipWhy" rows="2" maxlength="300" placeholder="e.g. Training day, not paid"></textarea>',
        validate: function (v) { return v.querySelector('#skipWhy').value.trim().length >= 3 ? null : 'why'; },
        collect: function (v) { return { why: v.querySelector('#skipWhy').value.trim() }; },
        submit: function (v) { return call('qb_review', { app: app, action: 'exclude', ids: [id], reason: v.why }); } });
      if (ok) { await loadNeeds(); }
      return;
    }
    if (act === 'bring-back') {
      await call('qb_review', { app: app, action: 'bring_back', ids: [id] });
      toast('Brought back — it is checked again on the next run');
      await loadNeeds();
      return;
    }
    if (act === 'draft') {
      await call('qb_pay_save', { what: b.dataset.what, action: b.dataset.do, id: id });
      toast(b.dataset.do === 'confirm' ? 'Confirmed' : 'Discarded');
      await loadNeeds();
      return;
    }
    if (act === 'connect') {
      b.disabled = true; b.textContent = 'Connecting…';
      await call('qb_app_connect', { app: app, action: 'connect' });
      toast('Connected — read only');
      await loadNeeds(); paintChips();
      return;
    }
    if (act === 'toggle') { ST.open[b.dataset.key] = !ST.open[b.dataset.key]; paintNow(); return; }
    if (act === 'to-needs') { toNeeds(); return; }
  } catch (err) {
    // The expected outcomes of a race, said as what they are.
    if (err.code === 'already_executed') toast('Somebody else approved this first. It has already been sent.');
    else if (err.code === 'changed_since') toast('This changed in QuickBooks since it was proposed. Ask for it again.');
    else toast(err.message);
    await loadNeeds().catch(function () {});
  }
});

// ── who you are, when you ask ───────────────────────────────────────────
function whenChecked(days) {
  if (days === null || days === undefined) return 'not dated';
  if (days <= 0) return 'checked today';
  if (days === 1) return 'checked yesterday';
  if (days < 31) return 'checked ' + days + ' days ago';
  var m = Math.round(days / 30);
  return 'checked ' + m + ' month' + (m === 1 ? '' : 's') + ' ago';
}
function paintWho(a) {
  var name = a.name || a.email || 'You';
  $('#who').textContent = (name.trim()[0] || '·').toUpperCase();
  $('#who').hidden = false;
  $('#role').textContent = a.has_access ? (a.role_label || 'QuickBooks') + (a.is_approver ? ' · you approve changes' : '') : 'No QuickBooks role recorded';
}
$('#who').addEventListener('click', function () {
  var a = ACCESS || {};
  var labels = a.area_labels || {}, viewOnly = a.view_only_areas || [];
  var names = (a.approvers || []).map(function (p) { return esc(p.name || p.email); });
  var row = function (k, v) { return '<div class="rowx"><div class="main"><small>' + k + '</small>' + v + '</div></div>'; };
  var s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-label="Your QuickBooks access">'
    + '<h2>' + esc(a.role_label || 'No QuickBooks role') + '</h2>'
    + (a.note ? '<p class="say" style="color:var(--label2);margin:4px 0 0">' + esc(a.note) + '</p>' : '')
    + '<div class="areas">' + (a.areas || []).map(function (x) {
        return '<span class="pill">' + esc(labels[x] || AREA_WORDS[x] || x) + (viewOnly.indexOf(x) !== -1 ? ' · view only' : '') + '</span>'; }).join('') + '</div>'
    + '<div class="card" style="margin-top:14px;padding:4px 16px">'
    + row('Signed in as', esc(a.name || '') + (a.email ? ' · ' + esc(a.email) : ''))
    + (a.has_access ? row('In QuickBooks you can', a.can_write_in_quickbooks ? 'View and change things' : 'View only — nothing you do can change QuickBooks')
        + row('Changes are approved by', names.length ? names.join(', ') + (a.is_approver ? ' — including you' : '')
            : 'Nobody yet. Until the workspace owner appoints an approver, nothing can change QuickBooks through Eesa.')
        + row('Noted', esc(whenChecked(a.age_days)) + (a.entered_by ? ' by ' + esc(a.entered_by) : '') + (a.stale ? ' — worth re-checking' : '')) : '')
    + '</div><p class="meta" style="margin:10px 4px 0">QuickBooks decides what you can see; Eesa only mirrors it. To change it, it changes in QuickBooks first.</p>'
    + '<div class="actions"><button class="btn" data-close>Done</button></div></div>';
  s.addEventListener('click', function (e) { if (e.target === s || e.target.hasAttribute('data-close')) s.remove(); });
  document.body.appendChild(s);
});

// ── first paint ─────────────────────────────────────────────────────────
// The role comes FIRST and everything else waits on it: what the brief reads,
// which suggestions appear, which cards can exist.
async function boot() {
  try {
    ACCESS = await platform('quickbooks_my_access', {});
    paintWho(ACCESS);
  } catch (e) {
    ACCESS = { areas: [], has_access: false, note: e.message };
    $('#role').textContent = 'Could not check your access';
  }
  loadHistory();
  loadBrief();
  await loadNeeds();
  paintChips();
  $('#now').scrollIntoView({ block: 'start' });
  // Keep what needs you current while the page stays open.
  setInterval(function () { if (!asking && document.visibilityState === 'visible') loadNeeds(); }, 60000);
}
</script>
